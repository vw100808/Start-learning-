<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Melbourne Open City — Prototype</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ef;background:#b7d0d4}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b7d0d4}
    canvas{display:block;width:100vw;height:100vh}
    #hud{position:fixed;left:16px;top:16px;max-width:420px;padding:11px 13px;border:1px solid rgba(255,255,255,.28);border-radius:10px;background:rgba(29,40,42,.68);backdrop-filter:blur(6px);font-size:12px;line-height:1.45;user-select:none}
    #hud b{font-size:13px}
    #status{position:fixed;right:16px;top:16px;padding:10px 12px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(29,40,42,.58);font-size:11px;text-align:right;min-width:180px;user-select:none}
    #minimap{position:fixed;right:16px;bottom:16px;width:180px;height:180px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(30,42,44,.72);overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    #mapCanvas{width:100%;height:100%;display:block}
    #dialogue{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);width:min(680px,calc(100vw - 40px));padding:15px 18px;border-radius:12px;background:rgba(30,39,41,.9);border:1px solid rgba(255,255,255,.25);display:none;font-size:14px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.24)}
    #dialogue strong{display:block;margin-bottom:5px}
    #quest{position:fixed;left:50%;top:16px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(29,40,42,.54);border:1px solid rgba(255,255,255,.2);font-size:11px;display:none}
  </style>
</head>
<body>
  <div id="hud"><b>Melbourne Open City · prototype</b><br>WASD move · Shift sprint · Space jump / interact · Mouse drag camera<br>Explore the city, follow the tram corridor, visit landmarks.</div>
  <div id="status">DISTRICT: CBD<br>TIME: 09:30<br>FPS: --</div>
  <div id="quest">Objective: reach Federation Square</div>
  <div id="dialogue"><strong id="dialogueTitle">City notice</strong><span id="dialogueText"></span></div>
  <div id="minimap"><canvas id="mapCanvas" width="180" height="180"></canvas></div>

  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
  </script>

  <script type="module">
    import * as THREE from 'three';

    // -------------------------------------------------------------------------
    // Melbourne Open City: scalable foundation
    // - Procedural geometry only; no external image textures.
    // - Ramp LUT lighting contract retained.
    // - Large navigable city canvas designed to grow into districts/quests.
    // -------------------------------------------------------------------------

    const WORLD_SIZE = 320;
    const HALF = WORLD_SIZE / 2;
    const PLAYER_EYE = 1.7;
    const WALK_SPEED = 4.2;
    const SPRINT_SPEED = 7.2;
    const JUMP_SPEED = 6.1;
    const GRAVITY = 15.5;
    const CITY_CENTER = new THREE.Vector3(0, 0, 0);

    const RAMPS = [
      {bp:.34, shadow:'#2d4a3e', lit:'#7fa250'}, // grass
      {bp:.41, shadow:'#62707d', lit:'#eee9d8'}, // wall
      {bp:.37, shadow:'#4d2d2a', lit:'#ad5f45'}, // brick/roof
      {bp:.35, shadow:'#352b25', lit:'#7e6045'}, // wood
      {bp:.31, shadow:'#34444e', lit:'#a2b8bb'}, // stone/concrete
      {bp:.42, shadow:'#31453a', lit:'#d8c58a'}, // accents
      {bp:.39, shadow:'#243b46', lit:'#557f88'}  // glass/cool metal
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#c8dfe3');
    scene.fog = new THREE.Fog('#c8dfe3', 110, 285);

    const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .1, 600);
    const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(-75,105,65);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048,2048);
    sun.shadow.camera.left = -125;
    sun.shadow.camera.right = 125;
    sun.shadow.camera.top = 125;
    sun.shadow.camera.bottom = -125;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 320;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xe5f1ee,0x38504b,.32));

    function createRampTexture(ramps){
      const width=256,height=ramps.length;
      const cv=document.createElement('canvas');cv.width=width;cv.height=height;
      const ctx=cv.getContext('2d',{alpha:false});
      ramps.forEach((r,row)=>{
        const split=Math.round(r.bp*width);
        ctx.fillStyle=r.shadow;ctx.fillRect(0,row,split,1);
        ctx.fillStyle=r.lit;ctx.fillRect(split,row,width-split,1);
      });
      const tex=new THREE.CanvasTexture(cv);
      tex.colorSpace=THREE.SRGBColorSpace;
      tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;
      tex.generateMipmaps=false;tex.flipY=false;
      tex.wrapS=THREE.ClampToEdgeWrapping;tex.wrapT=THREE.ClampToEdgeWrapping;
      return {texture:tex,rows:height};
    }
    const {texture:rampTexture,rows:rampRows}=createRampTexture(RAMPS);

    function makeRampMaterial(index,opts={}){
      const mat=new THREE.MeshPhongMaterial({
        color:0xffffff,shininess:0,flatShading:true,
        side:opts.side ?? THREE.FrontSide,
        transparent:opts.transparent ?? false,
        opacity:opts.opacity ?? 1,
        depthWrite:opts.depthWrite ?? true
      });
      mat.onBeforeCompile=shader=>{
        shader.uniforms.uRampMap={value:rampTexture};
        shader.uniforms.uRampRows={value:rampRows};
        shader.uniforms.uRampIndex={value:index};
        shader.uniforms.uSunDir={value:new THREE.Vector3(-.52,.78,.42).normalize()};
        shader.vertexShader=shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vRampWorldNormal;')
          .replace('#include <defaultnormal_vertex>', '#include <defaultnormal_vertex>\nvRampWorldNormal = normalize(mat3(modelMatrix) * objectNormal);');
        shader.fragmentShader=shader.fragmentShader
          .replace('#include <common>', '#include <common>\nuniform sampler2D uRampMap;\nuniform float uRampRows;\nuniform float uRampIndex;\nuniform vec3 uSunDir;\nvarying vec3 vRampWorldNormal;')
          .replace('#include <output_fragment>', `
            float diff = dot(normalize(vRampWorldNormal), normalize(uSunDir))*0.5+0.5;
            float shadowFactor = getShadowMask();
            shadowFactor = max(shadowFactor, 0.26);
            float coord = clamp(diff*shadowFactor,0.0,1.0);
            float row = (uRampIndex+0.5)/uRampRows;
            outgoingLight = texture2D(uRampMap,vec2(coord,row)).rgb;
            #include <output_fragment>
          `);
      };
      mat.customProgramCacheKey=()=>`mel-ramp-${index}`;
      return mat;
    }

    const M={
      grass:makeRampMaterial(0), wall:makeRampMaterial(1), roof:makeRampMaterial(2),
      wood:makeRampMaterial(3), stone:makeRampMaterial(4), accent:makeRampMaterial(5),
      glass:makeRampMaterial(6,{transparent:true,opacity:.82,depthWrite:false,side:THREE.DoubleSide})
    };

    function jitter(geo,amount=.012){
      const p=geo.attributes.position;
      for(let i=0;i<p.count;i++){
        const n=Math.sin(i*91.31)*43758.5453;
        const r=n-Math.floor(n);
        p.setX(i,p.getX(i)+(r-.5)*amount);
        p.setZ(i,p.getZ(i)+(0.5-r)*amount);
      }
      p.needsUpdate=true;geo.computeVertexNormals();return geo;
    }
    function addBox(parent,size,pos,mat,opts={}){
      const g=jitter(new THREE.BoxGeometry(...size),opts.jitter??.01);
      const m=new THREE.Mesh(g,mat);m.position.set(...pos);
      m.rotation.y=opts.ry??0;m.castShadow=opts.cast??true;m.receiveShadow=opts.receive??true;
      parent.add(m);return m;
    }
    function addCyl(parent,r,h,pos,mat,opts={}){
      const g=jitter(new THREE.CylinderGeometry(r,r*1.03,h,opts.segments??8),opts.jitter??.012);
      const m=new THREE.Mesh(g,mat);m.position.set(...pos);
      m.rotation.z=THREE.MathUtils.degToRad(opts.tilt??0);m.rotation.x=THREE.MathUtils.degToRad(opts.tiltX??0);
      m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
    }
    function addPlane(parent,w,d,pos,mat){
      const g=new THREE.PlaneGeometry(w,d,1,1);g.rotateX(-Math.PI/2);
      const m=new THREE.Mesh(g,mat);m.position.set(...pos);m.receiveShadow=true;parent.add(m);return m;
    }

    // -------------------------------------------------------------------------
    // City base: broad green/urban canvas with Yarra corridor and street grid.
    // -------------------------------------------------------------------------
    const world=new THREE.Group();scene.add(world);
    addPlane(world,WORLD_SIZE,WORLD_SIZE,[0,0,0],M.grass);

    const river=new THREE.Group();world.add(river);
    addPlane(river,270,34,[0,.015,48],M.stone);
    // Slightly irregular river banks.
    for(let i=-5;i<=5;i++){
      addBox(river,[25+((i+5)%3)*3,.06,1.2],[i*25+4,.05,28+Math.sin(i*1.8)*1.3],M.stone,{jitter:.002,cast:false});
      addBox(river,[22+((i+4)%4)*2,.06,1.0],[i*25-5,.05,66+Math.cos(i*1.6)*1.2],M.stone,{jitter:.002,cast:false});
    }

    const streets=new THREE.Group();world.add(streets);
    function road(x,z,w,d){
      addBox(streets,[w,.055,d],[x,.04,z],M.stone,{jitter:.003,cast:false,receive:true});
    }
    for(let x=-140;x<=140;x+=28) road(x,0,7,290);
    for(let z=-115;z<=115;z+=28) road(0,z,290,7);
    // Waterfront promenade.
    addBox(streets,[270,.08,2],[0,.08,31],M.wood,{jitter:.003,cast:false});
    addBox(streets,[270,.08,2],[0,.08,65],M.wood,{jitter:.003,cast:false});

    // Tram tracks as geometry, not textures.
    const tram=new THREE.Group();world.add(tram);
    function tramLine(z){
      addBox(tram,[272,.035,.13],[0,.095,z],M.accent,{jitter:.001,cast:false});
      addBox(tram,[272,.035,.13],[0,.095,z+.82],M.accent,{jitter:.001,cast:false});
    }
    tramLine(-14);tramLine(14);tramLine(70);

    // Street trees.
    const streetTrees=new THREE.Group();world.add(streetTrees);
    for(let x=-132;x<=132;x+=14){
      for(const z of [-10,10,38,82]){
        addCyl(streetTrees,.14,1.8,[x,.9,z],M.wood,{segments:7,tilt:(x%28===0?3:-3),jitter:.008});
        const crown=jitter(new THREE.IcosahedronGeometry(.85,1),.02);
        const cm=new THREE.Mesh(crown,M.grass);cm.position.set(x,2.0,z);cm.castShadow=true;cm.receiveShadow=true;streetTrees.add(cm);
      }
    }

    // -------------------------------------------------------------------------
    // Procedural CBD blocks. Each building is at least 2 volumes to keep the
    // silhouette readable and avoid "single box" architecture.
    // -------------------------------------------------------------------------
    const buildings=new THREE.Group();world.add(buildings);
    const buildingData=[];
    const hash=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)};

    function building(x,z,w,d,h,roofMat=M.roof){
      const g=new THREE.Group();g.position.set(x,0,z);
      const bodyH=Math.max(3,h-.8);
      addBox(g,[w,bodyH,d],[0,bodyH/2,0],M.wall,{jitter:.018});
      const annexW=w*(.35+.16*hash(x,z));
      const annexD=d*(.3+.12*hash(z,x));
      addBox(g,[annexW,bodyH*.58,annexD],[w*.25,bodyH*.29,d*.24],M.stone,{jitter:.015,ry:(hash(x,z)>0.5?.035:-.035)});
      // Roof cap with intentional small sag/tilt.
      addBox(g,[w+.18,.24,d+.18],[0,bodyH+.12,0],roofMat,{jitter:.01,ry:(hash(z,x)-.5)*.08});
      // A few vertical facade strips: cheap but legible from distance.
      for(let i=-1;i<=1;i++) if(Math.abs(i*w/3)<w*.52)
        addBox(g,[.09,bodyH*.72,.08],[i*w*.28,bodyH*.44,d*.51+.04],M.wood,{jitter:.003,cast:false});
      buildings.add(g);
      buildingData.push({group:g,x,z,w,d,h});
      return g;
    }

    const grid=[-126,-98,-70,-42,-14,14,42,70,98,126];
    for(const x of grid){
      for(const z of [-98,-70,-42,-14,14,98,126]){
        const dist=Math.hypot(x,z);
        const scale=Math.max(1,1-dist/250);
        const h=7+hash(x,z)*23*scale;
        building(x,z,11+hash(z,x)*7,11+hash(x+4,z+8)*7,h,hash(x,z)>.78?M.stone:M.roof);
      }
    }
    // Denser Southbank/CBD edge.
    for(const x of [-84,-56,-28,0,28,56,84]){
      for(const z of [42,70]){
        building(x,z,13+hash(x,z)*5,10+hash(z,x)*5,18+hash(x,z)*26,M.glass);
      }
    }

    // -------------------------------------------------------------------------
    // Recognisable Melbourne landmark cluster (stylised approximations).
    // Federation Square sits opposite Flinders Street Station by the Yarra.
    // -------------------------------------------------------------------------
    const landmarks=new THREE.Group();world.add(landmarks);
    const landmarkList=[];
    function landmark(name,pos,radius,fn){const g=new THREE.Group();g.position.set(pos[0],0,pos[1]);fn(g);landmarks.add(g);landmarkList.push({name,group:g,radius});return g;}

    // Flinders Street Station.
    landmark('Flinders Street Station',[-32,27],10,g=>{
      addBox(g,[30,5.6,7],[0,2.8,0],M.accent,{jitter:.014});
      addBox(g,[4,10,7],[-12,7,0],M.roof,{jitter:.012});
      addBox(g,[4,10,7],[0,7,0],M.roof,{jitter:.012});
      addBox(g,[4,8,7],[12,6,0],M.roof,{jitter:.012});
      addBox(g,[24,.7,1.2],[0,5.8,-4],M.wood,{jitter:.004});
      for(let i=-3;i<=3;i++) addBox(g,[.15,3,.12],[i*3,1.7,-4.15],M.wall,{jitter:.003,cast:false});
    });

    // Federation Square / shard-like volumes.
    landmark('Federation Square',[-17,12],9,g=>{
      for(let i=-2;i<=2;i++){
        const s=3.8+Math.abs(i)*.4;
        addBox(g,[s,1.4,s],[i*3.2,.7,0],M.stone,{jitter:.02,ry:i*.09});
      }
      addBox(g,[10,.22,4],[0,1.55,3],M.accent,{jitter:.004,cast:false});
    });

    // Eureka / Southbank tower silhouette.
    landmark('Southbank Tower',[20,65],13,g=>{
      addBox(g,[8,72,8],[0,36,0],M.glass,{jitter:.025});
      addBox(g,[11,3,11],[0,72,0],M.accent,{jitter:.008});
      addBox(g,[4,10,4],[0,77,0],M.roof,{jitter:.008});
    });

    // MCG-like stadium east of the CBD.
    landmark('MCG',[86,28],17,g=>{
      const bowl=new THREE.Mesh(jitter(new THREE.CylinderGeometry(18,20,4,16),.05),M.stone);
      bowl.position.y=2;bowl.scale.z=.82;bowl.castShadow=true;bowl.receiveShadow=true;g.add(bowl);
      addBox(g,[24,1,13],[0,4.4,0],M.grass,{jitter:.005,cast:false});
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4;
        addCyl(g,.28,9,[Math.cos(a)*17,5,Math.sin(a)*14],M.accent,{segments:6,tilt:8,jitter:.004});
      }
    });

    // Royal Exhibition Building / Carlton edge.
    landmark('Royal Exhibition Building',[-76,-92],12,g=>{
      addBox(g,[30,7,16],[0,3.5,0],M.wall,{jitter:.015});
      addBox(g,[24,12,10],[0,9,0],M.roof,{jitter:.012});
      addBox(g,[8,15,8],[0,12,0],M.accent,{jitter:.01});
      for(const x of [-10,10]) addBox(g,[.5,9,.5],[x,7,-5.3],M.wood,{jitter:.006});
    });

    // -------------------------------------------------------------------------
    // Tram vehicle / moving city-life cue.
    // -------------------------------------------------------------------------
    function createTramVehicle(){
      const g=new THREE.Group();
      addBox(g,[5.8,2.2,1.45],[0,1.4,0],M.accent,{jitter:.01});
      addBox(g,[4.4,1.1,1.48],[0,2.95,0],M.glass,{jitter:.008});
      for(const x of [-2,-.7,.7,2]) addCyl(g,.24,.38,[x,.32,-.76],M.stone,{segments:8,jitter:.003,tiltX:90});
      return g;
    }
    const tramVehicle=createTramVehicle();
    tramVehicle.position.set(-125,.02,14);world.add(tramVehicle);

    // Small NPC silhouettes; later these become schedules/dialogue systems.
    const npcs=new THREE.Group();world.add(npcs);
    const npcSeeds=[[-9,3],[9,-5],[-50,18],[38,67],[63,20],[-65,-70],[4,95]];
    npcSeeds.forEach(([x,z],i)=>{
      const n=new THREE.Group();n.position.set(x,0,z);
      addCyl(n,.22,1.25,[0,.65,0],M.wood,{segments:7,jitter:.01,tilt:i%2?4:-4});
      const h=jitter(new THREE.IcosahedronGeometry(.3,1),.01);const hm=new THREE.Mesh(h,M.accent);hm.position.y=1.45;hm.castShadow=true;n.add(hm);npcs.add(n);
      n.userData.phase=i*.8;
    });

    // -------------------------------------------------------------------------
    // Player / camera
    // -------------------------------------------------------------------------
    const player=new THREE.Group();player.position.set(-62,0,88);scene.add(player);
    const playerVisual=new THREE.Group();player.add(playerVisual);
    addCyl(playerVisual,.28,1.35,[0,.68,0],M.wood,{segments:7,jitter:.008});
    const head=jitter(new THREE.IcosahedronGeometry(.32,1),.01);
    const headMesh=new THREE.Mesh(head,M.accent);headMesh.position.y=1.52;headMesh.castShadow=true;playerVisual.add(headMesh);

    const keys=new Set();
    addEventListener('keydown',e=>keys.add(e.code));
    addEventListener('keyup',e=>keys.delete(e.code));

    let yaw=0.45,pitch=.34;
    let dragging=false,lastX=0,lastY=0;
    renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
    addEventListener('pointerup',()=>dragging=false);
    addEventListener('pointermove',e=>{
      if(!dragging)return;
      yaw-= (e.clientX-lastX)*.005;
      pitch-= (e.clientY-lastY)*.004;
      pitch=THREE.MathUtils.clamp(pitch,.16,.72);
      lastX=e.clientX;lastY=e.clientY;
    });

    const velocity=new THREE.Vector3();
    const move=new THREE.Vector3();
    let grounded=true;
    let cameraTarget=new THREE.Vector3();
    const clock=new THREE.Clock();

    function nearestLandmark(){
      let best=null,dist=Infinity;
      for(const item of landmarkList){
        const d=item.group.position.distanceTo(player.position);
        if(d<dist){dist=d;best=item;}
      }
      return {item:best,dist};
    }
    function nearestNPC(){
      let best=null,dist=Infinity;
      npcs.children.forEach(n=>{const d=n.position.distanceTo(player.position);if(d<dist){dist=d;best=n}});
      return {npc:best,dist};
    }

    function tryInteract(){
      const lm=nearestLandmark();
      if(lm.item&&lm.dist<11){showDialogue(lm.item.name, landmarkText(lm.item.name));return true}
      const nn=nearestNPC();
      if(nn.npc&&nn.dist<3.0){showDialogue('Melbourne local','The city is built to be walked: lanes, trams, river paths and public squares all connect.');return true}
      return false;
    }
    function landmarkText(name){
      if(name==='Federation Square')return 'A stylised civic plaza on the Yarra side of the CBD. The real precinct sits opposite Flinders Street Station.';
      if(name==='Flinders Street Station')return 'A historic Melbourne railway landmark, represented here as a deliberately simplified game silhouette.';
      if(name==='Southbank Tower')return 'Southbank skyline district. This prototype uses an abstract tower so the city remains fully procedural.';
      if(name==='MCG')return 'East of the CBD: a stadium landmark used as an exploration anchor.';
      return 'A city landmark anchor for future quests, interiors and activities.';
    }

    const dialogue=document.getElementById('dialogue');
    const dialogueTitle=document.getElementById('dialogueTitle');
    const dialogueText=document.getElementById('dialogueText');
    let dialogueTimer=0;
    function showDialogue(title,text){dialogueTitle.textContent=title;dialogueText.textContent=text;dialogue.style.display='block';dialogueTimer=4.2}

    function updatePlayer(dt){
      move.set(0,0,0);
      const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
      const right=new THREE.Vector3(forward.z,0,-forward.x);
      if(keys.has('KeyW'))move.add(forward);
      if(keys.has('KeyS'))move.sub(forward);
      if(keys.has('KeyD'))move.add(right);
      if(keys.has('KeyA'))move.sub(right);
      if(move.lengthSq()>0)move.normalize();
      const speed=(keys.has('ShiftLeft')||keys.has('ShiftRight'))?SPRINT_SPEED:WALK_SPEED;
      velocity.x=THREE.MathUtils.damp(velocity.x,move.x*speed,11,dt);
      velocity.z=THREE.MathUtils.damp(velocity.z,move.z*speed,11,dt);
      if((keys.has('Space')||keys.has('Spacebar'))&&grounded){
        if(tryInteract()){
          keys.delete('Space');keys.delete('Spacebar');
        }else{
          velocity.y=JUMP_SPEED;grounded=false;
        }
      }
      velocity.y-=GRAVITY*dt;
      player.position.x=THREE.MathUtils.clamp(player.position.x+velocity.x*dt,-HALF+7,HALF-7);
      player.position.z=THREE.MathUtils.clamp(player.position.z+velocity.z*dt,-HALF+7,HALF-7);
      player.position.y+=velocity.y*dt;
      if(player.position.y<0){player.position.y=0;velocity.y=0;grounded=true}
      if(move.lengthSq()>0.01)playerVisual.rotation.y=THREE.MathUtils.lerp(playerVisual.rotation.y,Math.atan2(move.x,move.z),.18);
    }

    function updateCamera(){
      const dist=13;
      const horizontal=Math.cos(pitch)*dist;
      cameraTarget.set(player.position.x,player.position.y+1.45,player.position.z);
      camera.position.set(
        cameraTarget.x-Math.sin(yaw)*horizontal,
        cameraTarget.y+Math.sin(pitch)*dist+.4,
        cameraTarget.z-Math.cos(yaw)*horizontal
      );
      camera.lookAt(cameraTarget);
    }

    // Objective: a simple open-world loop foundation.
    let questActive=true;
    const quest=document.getElementById('quest');
    function updateQuest(){
      const fed=landmarkList.find(x=>x.name==='Federation Square');
      if(!fed)return;
      const d=fed.group.position.distanceTo(player.position);
      if(questActive){
        quest.style.display='block';
        quest.textContent=d<12?'Objective complete: explore the Yarra waterfront':'Objective: reach Federation Square · '+Math.round(d)+'m';
        if(d<12)questActive=false;
      }else quest.style.display='none';
    }

    // District labelling for later streaming/content systems.
    function districtName(){
      const x=player.position.x,z=player.position.z;
      if(z>52)return 'Docklands / North CBD';
      if(z>25)return 'Yarra / Southbank';
      if(x>55)return 'East Melbourne';
      if(x<-55)return 'Carlton / West edge';
      return 'Melbourne CBD';
    }

    const mapCtx=document.getElementById('mapCanvas').getContext('2d');
    function drawMinimap(){
      const w=180,h=180,s=0.5,ox=w/2,oz=h/2;
      mapCtx.clearRect(0,0,w,h);
      mapCtx.fillStyle='#243437';mapCtx.fillRect(0,0,w,h);
      mapCtx.fillStyle='#42656a';mapCtx.fillRect(0,oz-(17* s),w,34*s);
      mapCtx.fillStyle='#596b64';
      for(let i=-150;i<=150;i+=28){mapCtx.fillRect(ox+i*s-1,10,3,h-20);mapCtx.fillRect(10,oz+i*s-1,w-20,3)}
      mapCtx.fillStyle='#d8c58a';landmarkList.forEach(l=>{const px=ox+l.group.position.x*s,py=oz+l.group.position.z*s;mapCtx.fillRect(px-2,py-2,4,4)});
      mapCtx.fillStyle='#f2eedb';const px=ox+player.position.x*s,py=oz+player.position.z*s;mapCtx.beginPath();mapCtx.arc(px,py,4,0,Math.PI*2);mapCtx.fill();
    }

    let fpsFrames=0,fpsTime=0,currentFps=0;
    function animate(){
      const dt=Math.min(clock.getDelta(),.05);
      updatePlayer(dt);updateCamera();updateQuest();drawMinimap();
      if(dialogueTimer>0){dialogueTimer-=dt;if(dialogueTimer<=0)dialogue.style.display='none'}
      // Living-city motion: trams and pedestrians are intentionally restrained.
      tramVehicle.position.x+=10*dt;if(tramVehicle.position.x>138)tramVehicle.position.x=-138;
      npcs.children.forEach(n=>{const p=n.userData.phase; n.position.x+=Math.sin(clock.elapsedTime*.45+p)*.008; n.position.z+=Math.cos(clock.elapsedTime*.35+p)*.006;});
      fpsFrames++;fpsTime+=dt;if(fpsTime>=.5){currentFps=Math.round(fpsFrames/fpsTime);fpsFrames=0;fpsTime=0}
      document.getElementById('status').innerHTML='DISTRICT: '+districtName().toUpperCase()+'<br>TIME: 09:30<br>FPS: '+currentFps+'<br>POS: '+Math.round(player.position.x)+', '+Math.round(player.position.z);
      renderer.render(scene,camera);
      requestAnimationFrame(animate);
    }

    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    updateCamera();animate();
  </script>
</body>
</html>
