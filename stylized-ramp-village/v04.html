<body>

<script type="module">
import * as THREE from 'three';
const WORLD=360,HALF=WORLD/2,WALK=4.4,SPRINT=7.7,CROUCH=2.25,JUMP=6.3,DASH=13,GRAVITY=16,clock=new THREE.Clock();
const scene=new THREE.Scene();scene.background=new THREE.Color('#c8dfe3');scene.fog=new THREE.Fog('#c8dfe3',110,330);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,700);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.NoToneMapping;document.body.appendChild(renderer.domElement);
const RAMPS=[{bp:.34,s:'#2d4a3e',l:'#7fa250'},{bp:.41,s:'#62707d',l:'#eee9d8'},{bp:.37,s:'#4d2d2a',l:'#ad5f45'},{bp:.35,s:'#352b25',l:'#7e6045'},{bp:.31,s:'#34444e',l:'#a2b8bb'},{bp:.42,s:'#31453a',l:'#d8c58a'},{bp:.39,s:'#243b46',l:'#557f88'},{bp:.38,s:'#31413d',l:'#718277'},{bp:.34,s:'#303940',l:'#737d84'},{bp:.32,s:'#283138',l:'#667178'}];
function rampTex(){const c=document.createElement('canvas'),w=256,h=RAMPS.length;c.width=w;c.height=h;const x=c.getContext('2d',{alpha:false});RAMPS.forEach((r,i)=>{const cut=Math.round(r.bp*w);x.fillStyle=r.s;x.fillRect(0,i,cut,1);x.fillStyle=r.l;x.fillRect(cut,i,w-cut,1)});const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.flipY=false;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t}const ramp=rampTex(),SUN=new THREE.Vector3(-.52,.78,.42).normalize();
function mat(i,o={}){const m=new THREE.MeshPhongMaterial({color:0xffffff,shininess:0,flatShading:true,side:o.side??THREE.FrontSide,transparent:o.transparent??false,opacity:o.opacity??1,depthWrite:o.depthWrite??true});m.onBeforeCompile=s=>{s.uniforms.uRampMap={value:ramp};s.uniforms.uRows={value:RAMPS.length};s.uniforms.uIndex={value:i};s.uniforms.uSun={value:SUN};s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWN;').replace('#include <defaultnormal_vertex>','#include <defaultnormal_vertex>\nvWN=normalize(mat3(modelMatrix)*objectNormal);');s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D uRampMap;uniform float uRows,uIndex;uniform vec3 uSun;varying vec3 vWN;').replace('#include <output_fragment>',`float d=dot(normalize(vWN),normalize(uSun))*.5+.5;float sh=max(getShadowMask(),.27);float u=clamp(d*sh,0.,1.);outgoingLight=texture2D(uRampMap,vec2(u,(uIndex+.5)/uRows)).rgb;#include <output_fragment>`)};m.customProgramCacheKey=()=>`mel-v04-${i}`;return m}
const M={grass:mat(0),wall:mat(1),roof:mat(2),wood:mat(3),stone:mat(4),accent:mat(5),glass:mat(6,{transparent:true,opacity:.82,depthWrite:false,side:THREE.DoubleSide}),fabric:mat(7),pants:mat(8),hair:mat(9)};
function hash(a,b){const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)}
function jitter(g,a=.012){const p=g.attributes.position;for(let i=0;i<p.count;i++){const r=hash(i+1,p.count+7);p.setX(i,p.getX(i)+(r-.5)*a);p.setZ(i,p.getZ(i)+(.5-r)*a)}p.needsUpdate=true;g.computeVertexNormals();return g}
function box(p,s,pos,m,o={}){const g=jitter(new THREE.BoxGeometry(...s),o.j??.01),x=new THREE.Mesh(g,m);x.position.set(...pos);x.rotation.y=o.ry??0;x.castShadow=o.cast??true;x.receiveShadow=o.receive??true;p.add(x);return x}
function cyl(p,r,h,pos,m,o={}){const g=jitter(new THREE.CylinderGeometry(r,r*1.02,h,o.seg??8),o.j??.008),x=new THREE.Mesh(g,m);x.position.set(...pos);x.rotation.z=THREE.MathUtils.degToRad(o.tilt??0);x.castShadow=o.cast??true;x.receiveShadow=o.receive??true;p.add(x);return x}
function plane(p,w,d,pos,m){const g=new THREE.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);const x=new THREE.Mesh(g,m);x.position.set(...pos);x.receiveShadow=true;p.add(x);return x}
const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(-80,110,70);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);Object.assign(sun.shadow.camera,{left:-145,right:145,top:145,bottom:-145,near:1,far:340});scene.add(sun);scene.add(new THREE.HemisphereLight(0xe5f1ee,0x38504b,.32));
const world=new THREE.Group();scene.add(world);plane(world,WORLD,WORLD,[0,0,0],M.grass);
const roads=new THREE.Group();world.add(roads);for(let x=-140;x<=140;x+=28)box(roads,[7,.05,300],[x,.035,0],M.stone,{j:.002,cast:false});for(let z=-112;z<=112;z+=28)box(roads,[300,.05,7],[0,.035,z],M.stone,{j:.002,cast:false});
const river=new THREE.Group();world.add(river);plane(river,300,34,[0,.02,55],M.glass);river.children[0].material.opacity=.72;for(let i=-6;i<=6;i++){box(river,[22+(i%3)*2,.07,1.2],[i*22,.08,37+Math.sin(i*1.7)*1.4],M.accent,{j:.002,cast:false});box(river,[22+(i%4)*2,.07,1.2],[i*22,.08,73+Math.cos(i*1.4)*1.2],M.wood,{j:.002,cast:false})}
const blocks=new THREE.Group();world.add(blocks);const colliders=[];function building(x,z,w,d,h){const g=new THREE.Group();g.position.set(x,0,z);const bh=Math.max(4,h-.8);box(g,[w,bh,d],[0,bh/2,0],M.wall,{j:.017});const aw=w*(.35+.16*hash(x,z)),ad=d*(.3+.12*hash(z,x));box(g,[aw,bh*.55,ad],[w*.24,bh*.29,d*.24],M.stone,{j:.014,ry:(hash(z,x)-.5)*.08});box(g,[w+.18,.24,d+.18],[0,bh+.12,0],hash(x,z)>.68?M.glass:M.roof,{j:.01});for(let i=-1;i<=1;i++)box(g,[.08,Math.min(15,bh*.7),.1],[i*w*.27,Math.min(8,bh*.43),d*.51],M.wood,{j:.002,cast:false});blocks.add(g);colliders.push({x,z,w:w*.48,d:d*.48})}
for(let x=-126;x<=126;x+=28)for(let z=-112;z<=126;z+=28){if(Math.abs(z-55)<20&&Math.abs(x)<120)continue;const r=hash(x,z),dist=Math.hypot(x,z);building(x,z,12+r*6,12+(1-r)*6,7+Math.max(0,25-dist*.08)+r*22)}
const landmarks=[];function lm(name,x,z,w,h,m=M.wall){const g=new THREE.Group();g.position.set(x,0,z);box(g,[w,h,w*.72],[0,h/2,0],m,{j:.012});box(g,[w*.72,.5,w*.55],[0,h+.25,0],M.accent,{j:.008});box(g,[w*.5,h*.23,.12],[0,h*.52,w*.37],M.glass,{j:.003,cast:false});blocks.add(g);landmarks.push({name,x,z})}
lm('Federation Square',-20,-18,18,10,M.stone);lm('Flinders Street Station',18,-18,30,9,M.roof);lm('Arts Centre',54,-48,15,28,M.wall);lm('Eureka Skydeck',72,-18,12,46,M.glass);lm('Queen Victoria Market',-72,-70,28,8,M.roof);lm('Docklands',106,72,23,16,M.wall);
const decor=new THREE.Group();world.add(decor);for(let x=-132;x<=132;x+=14){for(const z of [-10,10,38,82]){cyl(decor,.14,1.8,[x,.9,z],M.wood,{seg:7,tilt:x%28===0?3:-3});const c=new THREE.Mesh(jitter(new THREE.IcosahedronGeometry(.82,1),.02),M.grass);c.position.set(x,2.1,z);c.castShadow=true;decor.add(c)}for(const z of [-112,-56,0,56,112]){cyl(decor,.055,3,[x,1.5,z],M.wood,{seg:6,tilt:5});cyl(decor,.18,.09,[x-.1,3.02,z],M.accent,{seg:6})}}
// ---------------- Player: original procedural fashion character ----------------
const player=new THREE.Group();world.add(player);player.position.set(-84,-0.0,-80);const rig=new THREE.Group();player.add(rig);rig.userData={limbs:[]};
const hip=box(rig,[.48,.28,.30],[0,.95,0],M.pants,{j:.004});const torso=box(rig,[.63,.72,.38],[0,1.38,0],M.fabric,{j:.006});const shirt=box(rig,[.33,.28,.39],[0,1.48,-.02],M.wall,{j:.004});
const legL=box(rig,[.22,.78,.25],[-.15,.45,0],M.pants,{j:.005}),legR=box(rig,[.22,.78,.25],[.15,.45,0],M.pants,{j:.005});const shoeL=box(rig,[.27,.12,.48],[-.15,.05,-.08],M.wall,{j:.003}),shoeR=box(rig,[.27,.12,.48],[.15,.05,-.08],M.wall,{j:.003});rig.userData.limbs.push(legL,legR);
const armL=box(rig,[.18,.66,.19],[-.43,1.39,0],M.fabric,{j:.006}),armR=box(rig,[.18,.66,.19],[.43,1.39,0],M.fabric,{j:.006});const handL=box(rig,[.17,.18,.17],[-.43,1.03,0],M.wall,{j:.003}),handR=box(rig,[.17,.18,.17],[.43,1.03,0],M.wall,{j:.003});rig.userData.limbs.push(armL,armR);
const neck=cyl(rig,.14,.16,[0,1.83,0],M.wall,{seg:8,j:.004});const head=new THREE.Mesh(jitter(new THREE.SphereGeometry(.34,12,8),.008),M.wall);head.position.y=2.1;head.castShadow=true;rig.add(head);const hair=new THREE.Mesh(jitter(new THREE.SphereGeometry(.36,12,7,.0,Math.PI*2,0,Math.PI*.56),.008),M.hair);hair.position.set(0,2.22,.015);hair.castShadow=true;rig.add(hair);
// relaxed crossbody sling + watch detail
const strap=box(rig,[.075,1.05,.045],[.17,1.42,-.18],M.accent,{j:.002,ry:-.34,cast:false});const bag=box(rig,[.25,.28,.10],[.31,1.1,.02],M.wood,{j:.003});cyl(rig,.035,.11,[.52,1.42,.02],M.accent,{seg:6,cast:false});
let crouch=false,moveMode='camera',yaw=.55,pitch=.30,camDist=13,drag=false,lastX=0,lastY=0,dashCd=0,stamina=1,velY=0,grounded=true;
const keys={};function setKey(k,v){keys[k]=v}addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();setKey(e.code,true);if(e.code==='KeyF')interact();if(e.code==='KeyC')crouch=!crouch;if(e.code==='KeyM'){moveMode=moveMode==='camera'?'world':'camera';show('Movement mode',moveMode==='camera'?'Camera-relative':'World-relative')}});addEventListener('keyup',e=>setKey(e.code,false));renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch-dy*.004,.10,.62)});renderer.domElement.addEventListener('wheel',e=>camDist=THREE.MathUtils.clamp(camDist+e.deltaY*.012,8,19));
function show(a,b){dialogueTitle.textContent=a;dialogueText.textContent=b;dialogue.style.display='block';clearTimeout(show.t);show.t=setTimeout(()=>dialogue.style.display='none',2600)}
function nearest(){let n=null,bd=5;for(const p of landmarks){const d=Math.hypot(player.position.x-p.x,player.position.z-p.z);if(d<bd){bd=d;n=p}}return n}
function interact(){const n=nearest();if(n)show(n.name,'可互动地标。后续将扩展室内、NPC、任务和环境事件。')}
function tryMove(dx,dz){const r=.45,nx=THREE.MathUtils.clamp(player.position.x+dx,-HALF+2,HALF-2),nz=THREE.MathUtils.clamp(player.position.z+dz,-HALF+2,HALF-2);for(const c of colliders){if(Math.abs(nx-c.x)<c.w+r&&Math.abs(player.position.z-c.z)<c.d+r)return;if(Math.abs(player.position.x-c.x)<c.w+r&&Math.abs(nz-c.z)<c.d+r)return}player.position.x=nx;player.position.z=nz}
const fwd=new THREE.Vector3(),right=new THREE.Vector3(),wish=new THREE.Vector3(),camTarget=new THREE.Vector3(),camOffset=new THREE.Vector3();
function updatePlayer(dt){const ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),has=Math.hypot(ix,iz);if(moveMode==='camera'){fwd.set(Math.sin(yaw),0,Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));wish.set(0,0,0);if(iz>0)wish.add(fwd);if(iz<0)wish.sub(fwd);if(ix>0)wish.add(right);if(ix<0)wish.sub(right)}else{wish.set(ix,0,iz)}if(wish.lengthSq()>0)wish.normalize();const sprint=(keys.ShiftLeft||keys.ShiftRight)&&has&&!crouch&&stamina>.03;const speed=crouch?CROUCH:(sprint?SPRINT:WALK);if(sprint)stamina=Math.max(0,stamina-dt*.34);else stamina=Math.min(1,stamina+dt*.20);tryMove(wish.x*speed*dt,wish.z*speed*dt);if(has)player.rotation.y=Math.atan2(wish.x,wish.z);velY-=GRAVITY*dt;player.position.y+=velY*dt;if(player.position.y<=0){player.position.y=0;velY=0;grounded=true}rig.scale.y+=(crouch?.86:1-rig.scale.y)*Math.min(1,dt*10);const moving=has>0;const t=clock.elapsedTime*10;const swing=moving?Math.sin(t)*.42:0;legL.rotation.x=swing;legR.rotation.x=-swing;armL.rotation.x=-swing*.72;armR.rotation.x=swing*.72;dashCd=Math.max(0,dashCd-dt)}
function jump(){if(grounded&&!crouch){velY=JUMP;grounded=false}}
function dash(){if(dashCd>0||stamina<.20)return;const d=wish.lengthSq()?wish:fwd;tryMove(d.x*DASH,d.z*DASH);stamina=Math.max(0,stamina-.20);dashCd=.75}
addEventListener('keydown',e=>{if(e.code==='Space')jump();if(e.code==='KeyQ'||e.code==='KeyE')dash()});
function updateCamera(dt){camTarget.set(player.position.x,player.position.y+(crouch?1.38:1.58),player.position.z);const cp=Math.cos(pitch),sp=Math.sin(pitch);camOffset.set(Math.sin(yaw)*cp*camDist,sp*camDist,Math.cos(yaw)*cp*camDist);const desired=camTarget.clone().add(camOffset);camera.position.lerp(desired,1-Math.exp(-dt*8));camera.lookAt(camTarget)}
const map=document.getElementById('mapCanvas'),ctx=map.getContext('2d'),status=document.getElementById('status'),fill=document.getElementById('staminaFill');function drawMap(){const s=180,k=s/WORLD;ctx.clearRect(0,0,s,s);ctx.fillStyle='rgba(22,32,35,.9)';ctx.fillRect(0,0,s,s);ctx.fillStyle='#52767d';ctx.fillRect(0,(55+HALF)*k,s,34*k);ctx.strokeStyle='rgba(180,190,190,.32)';ctx.lineWidth=1;for(let x=-140;x<=140;x+=28){ctx.beginPath();ctx.moveTo((x+HALF)*k,0);ctx.lineTo((x+HALF)*k,s);ctx.stroke()}for(let z=-112;z<=112;z+=28){ctx.beginPath();ctx.moveTo(0,(z+HALF)*k);ctx.lineTo(s,(z+HALF)*k);ctx.stroke()}ctx.fillStyle='#d8c58a';for(const p of landmarks){ctx.beginPath();ctx.arc((p.x+HALF)*k,(p.z+HALF)*k,3,0,7);ctx.fill()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((player.position.x+HALF)*k,(player.position.z+HALF)*k,3.5,0,7);ctx.fill()}
function district(){const x=player.position.x,z=player.position.z;if(z<30&&z>-5)return'YARRA / CBD';if(z<0&&x>20)return'SOUTHBANK';if(x>80&&z>35)return'DOCKLANDS';if(z<-45)return'SOUTHERN CBD';if(z>75)return'NORTH CBD';return'CBD'}
let frames=0,acc=0,fps=60;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);updatePlayer(dt);updateCamera(dt);drawMap();frames++;acc+=dt;if(acc>0.5){fps=Math.round(frames/acc);frames=0;acc=0}const sprint=keys.ShiftLeft||keys.ShiftRight;status.innerHTML=`DISTRICT: ${district()}<br>TIME: 09:30<br>MODE: ${moveMode.toUpperCase()}${crouch?' · CROUCH':''}<br>SPEED: ${sprint&&!crouch?'SPRINT':crouch?'CROUCH':'WALK'}<br>STAMINA: ${Math.round(stamina*100)}%<br>FPS: ${fps}`;fill.style.width=(stamina*100)+'%';renderer.render(scene,camera)}
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();setKey(k,true)});b.addEventListener('pointerup',e=>{e.preventDefault();setKey(k,false)});b.addEventListener('pointercancel',()=>setKey(k,false));b.addEventListener('pointerleave',()=>setKey(k,false))}for(const b of document.querySelectorAll('[data-act]'))b.addEventListener('pointerdown',e=>{e.preventDefault();const a=b.dataset.act;if(a==='jump')jump();else if(a==='dash')dash();else interact()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop();
