<script type="module">
import * as THREE from 'three';

const CFG={pixel:1.25,worldX:220,worldZ:150,gridRot:THREE.MathUtils.degToRad(8.0),walk:4.7,sprint:7.8,shadowMin:.28};
const scene=new THREE.Scene();scene.background=new THREE.Color('#9fc4c8');scene.fog=new THREE.Fog('#9fc4c8',105,300);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,CFG.pixel));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.NoToneMapping;document.body.appendChild(renderer.domElement);

// Procedural 2D ramp LUT: one row per material, no image textures.
const RAMPS=[
 ['#3e594a','#8ea96b'], // grass
 ['#59656c','#d8cfc1'], // warm concrete
 ['#29383c','#717b7d'], // asphalt
 ['#5a302b','#bd7257'], // brick
 ['#5b4634','#c6a56c'], // sandstone / heritage ochre
 ['#282f34','#66747a'], // dark metal
 ['#21434e','#7197a0'], // blue glass
 ['#3b3d37','#aaa38f'], // pale stone
 ['#344d42','#b7c27e'], // plants
 ['#4a342a','#967255'], // timber
 ['#6a4c3a','#d29d7c']  // skin
];
const lutCanvas=document.createElement('canvas');lutCanvas.width=256;lutCanvas.height=RAMPS.length;const lutCtx=lutCanvas.getContext('2d',{alpha:false});
RAMPS.forEach((r,i)=>{const cut=96;lutCtx.fillStyle=r[0];lutCtx.fillRect(0,i,cut,1);lutCtx.fillStyle=r[1];lutCtx.fillRect(cut,i,256-cut,1)});
const lut=new THREE.CanvasTexture(lutCanvas);lut.magFilter=THREE.NearestFilter;lut.minFilter=THREE.NearestFilter;lut.generateMipmaps=false;lut.flipY=false;lut.colorSpace=THREE.SRGBColorSpace;
const SUN_DIR=new THREE.Vector3(-.58,.76,.30).normalize();
function rampMat(row,opts={}){const m=new THREE.MeshPhongMaterial({color:0xffffff,flatShading:true,shininess:0,side:opts.side??THREE.FrontSide,transparent:opts.transparent??false,opacity:opts.opacity??1,depthWrite:opts.depthWrite??true});m.onBeforeCompile=s=>{
 s.uniforms.uLut={value:lut};s.uniforms.uRows={value:RAMPS.length};s.uniforms.uRow={value:row};s.uniforms.uSunDir={value:SUN_DIR};
 s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWorldN;').replace('#include <defaultnormal_vertex>','#include <defaultnormal_vertex>\nvWorldN=normalize(mat3(modelMatrix)*objectNormal);');
 s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D uLut;uniform float uRows,uRow;uniform vec3 uSunDir;varying vec3 vWorldN;').replace('#include <lights_fragment_end>',`#include <lights_fragment_end>\nfloat d=dot(normalize(vWorldN),normalize(uSunDir))*.5+.5;float sh=max(getShadowMask(),${CFG.shadowMin});float u=clamp(d*sh,0.0,1.0);outgoingLight=texture2D(uLut,vec2(u,(uRow+.5)/uRows)).rgb;`)
};m.customProgramCacheKey=()=>`v10-ramp-${row}`;return m}
const M={grass:rampMat(0),concrete:rampMat(1),asphalt:rampMat(2),brick:rampMat(3),heritage:rampMat(4),metal:rampMat(5),glass:rampMat(6,{transparent:true,opacity:.78,depthWrite:false,side:THREE.DoubleSide}),stone:rampMat(7),foliage:rampMat(8),wood:rampMat(9),skin:rampMat(10)};

const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(95,125,-75);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0007;Object.assign(sun.shadow.camera,{left:-125,right:125,top:100,bottom:-100,near:1,far:320});scene.add(sun);scene.add(new THREE.HemisphereLight(0xddebea,0x334b46,.5));

function mat4(){return new THREE.Matrix4()}
function addBox(parent,size,pos,m,opts={}){const g=new THREE.BoxGeometry(...size);const mesh=new THREE.Mesh(g,m);mesh.position.set(...pos);mesh.rotation.y=opts.ry??0;mesh.castShadow=opts.cast??false;mesh.receiveShadow=opts.receive??false;parent.add(mesh);return mesh}
function addCyl(parent,r,h,pos,m,opts={}){const g=new THREE.CylinderGeometry(r,r*(opts.topScale??1.02),h,opts.seg??8);const mesh=new THREE.Mesh(g,m);mesh.position.set(...pos);mesh.rotation.y=opts.ry??0;mesh.rotation.z=THREE.MathUtils.degToRad(opts.tilt??0);mesh.castShadow=opts.cast??false;mesh.receiveShadow=opts.receive??false;parent.add(mesh);return mesh}
function roof(parent,w,d,y,m){const g=new THREE.ConeGeometry(Math.max(w,d)*.70,.85,4);g.scale(w/Math.max(w,d),1,d/Math.max(w,d));g.rotation.y=Math.PI/4;const mesh=new THREE.Mesh(g,m);mesh.position.y=y;mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function rotateToGrid(g){g.rotation.y=CFG.gridRot;return g}

const world=new THREE.Group();scene.add(world);addBox(world,[CFG.worldX,.10,CFG.worldZ],[0,-.08,0],M.grass,{receive:true});

// Main Hoddle-grid roads: broad streets with narrow laneways inside blocks.
const roads=new THREE.Group();rotateToGrid(roads);world.add(roads);const colliders=[];
const majorX=[-90,-60,-30,0,30,60,90];const majorZ=[-60,-30,0,30,60];
for(const x of majorX){addBox(roads,[6,.08,145],[x,.02,0],M.asphalt);addBox(roads,[.12,.022,145],[x,.07,0],M.metal);}
for(const z of majorZ){addBox(roads,[210,.08,6],[0,.02,z],M.asphalt);addBox(roads,[210,.022,.12],[0,.07,z],M.metal);}
// Sidewalk bands and bluestone-like curb strips.
for(const x of majorX){addBox(roads,[8,.18,145],[x,.09,0],M.stone);addBox(roads,[8.5,.07,145],[x,.20,0],M.concrete);}
for(const z of majorZ){addBox(roads,[210,.18,8],[0,.09,z],M.stone);addBox(roads,[210,.07,8.5],[0,.20,z],M.concrete);}

// Laneways: Melbourne's smaller internal lanes, offset within blocks.
for(const x of [-75,-45,-15,15,45,75])addBox(roads,[2.6,.06,24],[x,.035,-15],M.asphalt);
for(const z of [-45,-15,15,45])addBox(roads,[24,.06,2.6],[-15,.035,z],M.asphalt);

// Yarra River, north bank promenade and Princes Bridge.
const river=new THREE.Group();world.add(river);addBox(river,[220,.12,25],[0,-.035,-88],M.glass,{receive:false});
for(let x=-100;x<=100;x+=20){addBox(river,[17,.05,.55],[x,.06,-73+Math.sin(x*.08)*1.4],M.stone);addBox(river,[17,.05,.5],[x,.06,-103+Math.cos(x*.08)*1.2],M.stone)}
const bridge=new THREE.Group();world.add(bridge);addBox(bridge,[18,.28,32],[0,.20,-71],M.heritage,{cast:true,receive:true});
for(const sx of [-7,7]){addCyl(bridge,.75,1.5,[sx,.98,-71],M.stone,{seg:10,cast:true});for(let i=-4;i<=4;i++)addCyl(bridge,.08,1.8,[sx,.2,-71+i*4],M.metal,{seg:6,tilt:i%2?6:-6})}

// Global window instances for performance.
const winGeo=new THREE.BoxGeometry(1.0,.72,.06),winDark=new THREE.InstancedMesh(winGeo,M.glass,2200),winWarm=new THREE.InstancedMesh(winGeo,M.heritage,700);winDark.frustumCulled=true;winWarm.frustumCulled=true;world.add(winDark,winWarm);
let winN=0,warmN=0;
function windowFront(x,y,z,w,rows,cols,matKind='dark',step=2.2){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const ox=(-w*.5)+1.35+c*step;if(Math.abs(ox)>w*.49)continue;const o=new THREE.Object3D();o.position.set(x+ox,y+r*2.15,z);o.updateMatrix();(matKind==='warm'?winWarm:winDark).setMatrixAt(matKind==='warm'?warmN++:winN++,o.matrix)}}
function windowSide(x,y,z,d,rows,cols,rot=0){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const oz=(-d*.5)+1.35+c*2.2;if(Math.abs(oz)>d*.49)continue;const o=new THREE.Object3D();o.position.set(x,y+r*2.15,z+oz);o.rotation.y=rot;o.updateMatrix();winDark.setMatrixAt(winN++,o.matrix)}}

const buildings=new THREE.Group();world.add(buildings);const bData=[];
function genericBuilding(x,z,w,d,h,style=0){const g=new THREE.Group();g.position.set(x,0,z);const body=style===0?M.stone:style===1?M.heritage:M.concrete;addBox(g,[w,h,d],[0,h/2,0],body,{cast:true,receive:true});const podiumH=Math.min(4.2,h*.22);addBox(g,[w*1.06,podiumH,d*1.04],[0,podiumH/2,0],style===1?M.heritage:M.concrete,{cast:true,receive:true});
 if(h<18){roof(g,w,d,h+.2,M.heritage)}else{addBox(g,[w*.72,.55,d*.72],[0,h+.25,0],M.metal,{cast:true});}
 const rows=Math.max(1,Math.floor((h-3)/2.15)),cols=Math.max(2,Math.floor((w-2)/2.2));windowFront(x,h-2.5,z-d*.505,w,rows,cols,style===1?'warm':'dark');windowFront(x,h-2.5,z+d*.505,w,rows,cols,style===1?'warm':'dark');windowSide(x-w*.505,h-2.5,z,d,rows,Math.max(2,Math.floor(d/2.2)),Math.PI/2);windowSide(x+w*.505,h-2.5,z,d,rows,Math.max(2,Math.floor(d/2.2)),Math.PI/2);
 for(const yy of [3.0,6.0,9.0])if(yy<h) addBox(g,[w+.12,.09,d+.12],[0,yy,0],M.metal,{cast:false});
 buildings.add(rotateToGrid(g));bData.push({g,x,z,w,d,h});colliders.push({minX:x-w*.5-1,maxX:x+w*.5+1,minZ:z-d*.5-1,maxZ:z+d*.5+1});return g}

// Accurate-ish block massing: lower, articulated heritage fabric nearer Flinders / Fed Square; taller glass towers farther east and south.
for(const x of [-75,-45,-15,15,45,75])for(const z of [-60,-30,0,30,60]){
 const dist=Math.hypot(x*.9,(z+5)*.85);const heritage=dist<58&&z>-25;const h=heritage?(9+Math.abs((x+z)%3)*2):(15+Math.max(0,24-dist*.14)+Math.abs((x*13+z*7)%11));
 genericBuilding(x,z,18+(Math.abs(x+z)%3)*2,17+(Math.abs(x*2-z)%3)*1.5,h,heritage?1:(h>27?2:0));
}

// Federation Square — interlocking, angular volumes surrounding a civic void.
const fed=new THREE.Group();fed.position.set(0,0,-33);world.add(fed);
addBox(fed,[24,.7,18],[0,.35,0],M.concrete,{cast:true,receive:true});
const f1=addBox(fed,[15,7,10],[-7,3.5,-2],M.heritage,{cast:true,receive:true,ry:-.19});
const f2=addBox(fed,[13,9,9],[6,4.5,2],M.stone,{cast:true,receive:true,ry:.23});
const f3=addBox(fed,[10,6,8],[-1,3,6],M.metal,{cast:true,receive:true,ry:-.34});
addBox(fed,[12,.25,12],[0,.85,0],M.asphalt);addBox(fed,[7,.18,9],[2,.96,-1],M.heritage);
for(const p of [[-11,4,-6],[10,5,5],[-1,3.5,8]])for(let i=0;i<5;i++)addBox(fed,[1.3,.08,5.6],[p[0]+(i-2)*1.4,p[1]+1.1,p[2]],M.metal,{ry:.24});

// Flinders Street Station: long heritage frontage, central dome, clock-face stack, side domes.
const fl=new THREE.Group();fl.position.set(0,0,-16);world.add(fl);addBox(fl,[52,8,10],[0,4,0],M.heritage,{cast:true,receive:true});addBox(fl,[46,3,12],[0,9,0],M.heritage,{cast:true,receive:true});
for(let i=-5;i<=5;i++)addBox(fl,[2.9,5.5,.55],[i*4.1,4.6,-5.35],M.stone,{cast:true});
addBox(fl,[14,11,11],[0,6.1,-.1],M.heritage,{cast:true,receive:true});
const dome=new THREE.Mesh(new THREE.SphereGeometry(7.0,24,12,0,Math.PI*2,0,Math.PI/2),M.heritage);dome.position.set(0,11.4,-.2);dome.scale.set(1.45,0.72,1);dome.castShadow=true;dome.receiveShadow=true;fl.add(dome);
for(const sx of [-16,16]){const d=new THREE.Mesh(new THREE.SphereGeometry(3.1,18,9,0,Math.PI*2,0,Math.PI/2),M.heritage);d.position.set(sx,9.6,0);d.scale.set(1.2,.7,1);d.castShadow=true;fl.add(d)}
addBox(fl,[11,3.6,.5],[0,6.2,-5.65],M.glass,{cast:false});
// clock disk: ring + hands, deliberately geometry-only.
const clockRing=new THREE.Mesh(new THREE.CylinderGeometry(1.75,1.75,.22,24),M.stone);clockRing.rotation.x=Math.PI/2;clockRing.position.set(0,8.8,-5.9);fl.add(clockRing);addBox(fl,[.14,2.6,.12],[0,8.8,-6.08],M.metal,{cast:false});addBox(fl,[1.55,.14,.12],[0,8.8,-6.09],M.metal,{cast:false});

// St Paul's Cathedral: Gothic body and three tall spires immediately north-west of Fed Square.
const stpaul=new THREE.Group();stpaul.position.set(-21,0,-4);world.add(stpaul);addBox(stpaul,[16,12,24],[0,6,0],M.stone,{cast:true,receive:true});addBox(stpaul,[22,5,10],[0,14,-2],M.stone,{cast:true});
for(const x of [-8.5,8.5]){const s=new THREE.Mesh(new THREE.ConeGeometry(3.1,20,4),M.heritage);s.position.set(x,20,0);s.castShadow=true;stpaul.add(s)}const cs=new THREE.Mesh(new THREE.ConeGeometry(2.3,27,4),M.heritage);cs.position.set(0,25,2);cs.castShadow=true;stpaul.add(cs);

// Eureka Tower: tall dark glass shaft + light/gold crown; 297.3m real height.
const eureka=new THREE.Group();eureka.position.set(42,0,-47);world.add(eureka);addBox(eureka,[10.5,72,10.5],[0,36,0],M.glass,{cast:true,receive:true});addBox(eureka,[11.2,8,11.2],[0,72.5,0],M.metal,{cast:true});addBox(eureka,[8.3,10.2,8.3],[0,79,0],M.heritage,{cast:true});addBox(eureka,[2.2,1.5,2.2],[0,84.7,0],M.metal,{cast:true});for(let y=10;y<70;y+=6)addBox(eureka,[11.0,.18,11.0],[0,y,0],M.metal,{cast:false});

// Arts Centre Melbourne: theatre base + iconic long spire (real spire 162m including mast).
const arts=new THREE.Group();arts.position.set(22,0,-70);world.add(arts);addBox(arts,[24,8,17],[0,4,0],M.concrete,{cast:true,receive:true});addBox(arts,[18,16,11],[0,12,1],M.stone,{cast:true});const artsSpire=new THREE.Mesh(new THREE.ConeGeometry(3.0,39,10),M.metal);artsSpire.position.set(0,34,0);artsSpire.scale.z=.75;artsSpire.castShadow=true;arts.add(artsSpire);for(let i=0;i<8;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(3.2-i*.24,.08,5,18),M.heritage);ring.rotation.x=Math.PI/2;ring.position.set(0,17+i*2.8,0);arts.add(ring)}

// NGV International massing: horizontal podium, broad dark wall, blue entrance/water edge.
const ngv=new THREE.Group();ngv.position.set(-12,0,-74);world.add(ngv);addBox(ngv,[34,7,22],[0,3.5,0],M.stone,{cast:true,receive:true});addBox(ngv,[29,10,17],[0,8.5,0],M.concrete,{cast:true,receive:true});addBox(ngv,[22,5,.6],[0,8.2,-8.9],M.glass,{cast:false});addBox(ngv,[23,.16,5],[0,.3,-11],M.glass,{cast:false});addBox(ngv,[30,.25,2],[0,12,0],M.heritage,{cast:false});

// CBD street trees and heritage-style lamp posts, instanced.
const treeN=92;const trunkIM=new THREE.InstancedMesh(new THREE.CylinderGeometry(.15,.18,2.1,7),M.wood,treeN);const crownIM=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.95,1),M.foliage,treeN);const lampIM=new THREE.InstancedMesh(new THREE.CylinderGeometry(.06,.07,3.1,7),M.metal,80);let ti=0,li=0;
for(const x of [-88,-58,-28,2,32,62,92])for(const z of [-54,-24,6,36,66]){if(ti>=treeN)break;const o=new THREE.Object3D();o.position.set(x+(z%2)*2,.95,z);o.updateMatrix();trunkIM.setMatrixAt(ti,o.matrix);o.position.y=2.55;o.scale.setScalar(.82+((ti%5)*.06));o.updateMatrix();crownIM.setMatrixAt(ti++,o.matrix)}
for(let i=0;i<80;i++){const o=new THREE.Object3D();const row=Math.floor(i/20),col=i%20;o.position.set(-95+col*10,1.55,-66+row*39);o.rotation.z=(i%2?.05:-.05);o.updateMatrix();lampIM.setMatrixAt(li++,o.matrix)}
trunkIM.instanceMatrix.needsUpdate=true;crownIM.instanceMatrix.needsUpdate=true;lampIM.instanceMatrix.needsUpdate=true;world.add(trunkIM,crownIM,lampIM);

// Heritage shopfront rhythm near the central core: awnings, bays and cornices.
const shop=new THREE.Group();rotateToGrid(shop);world.add(shop);for(const x of [-74,-44,-14,16,46]){addBox(shop,[17,3.0,.36],[x,1.8,-.5],M.brick);addBox(shop,[16.5,.22,.55],[x,3.3,-.75],M.heritage);for(let c=-1;c<=1;c++){addBox(shop,[4.1,2.0,.25],[x+c*4.8,5.0,-.75],M.glass);addBox(shop,[.16,2.3,.3],[x+c*4.8-2.1,5.0,-.88],M.wood)}}

// Player: visible, proportional, clean modern urban silhouette.
const player=new THREE.Group();player.position.set(-4,.15,-45);world.add(player);const avatar=new THREE.Group();player.add(avatar);
addBox(avatar,[.56,1.35,.48],[0,1.0,0],M.wood,{cast:true,receive:true});addBox(avatar,[.66,1.25,.62],[0,2.15,0],M.concrete,{cast:true,receive:true});addBox(avatar,[.72,.12,.66],[0,2.78,0],M.metal,{cast:true});const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.36,1),M.skin);head.position.y=3.2;head.castShadow=true;avatar.add(head);const hair=new THREE.Mesh(new THREE.IcosahedronGeometry(.31,1),M.metal);hair.scale.y=.55;hair.position.set(0,3.45,-.02);hair.castShadow=true;avatar.add(hair);addBox(avatar,[.18,1.02,.15],[-.48,2.12,.02],M.wood,{cast:true});addBox(avatar,[.18,1.02,.15],[.48,2.12,.02],M.wood,{cast:true});

// Camera-relative movement fix: derive forward/right from the actual camera every frame.
let yaw=.15,pitch=.33,distance=11.0,drag=false;let velocityY=0,onGround=true;const keys=new Set();
window.addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'&&onGround){velocityY=6.0;onGround=false}});window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){drag=true;renderer.domElement.setPointerCapture?.(e.pointerId)}});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(!drag)return;yaw-=e.movementX*.0052;pitch=THREE.MathUtils.clamp(pitch+e.movementY*.0032,.16,.62)});window.addEventListener('wheel',e=>distance=THREE.MathUtils.clamp(distance+e.deltaY*.015,8,16),{passive:true});
function blocked(px,pz){const margin=.55;return colliders.some(c=>px>c.minX-margin&&px<c.maxX+margin&&pz>c.minZ-margin&&pz<c.maxZ+margin)}
const camForward=new THREE.Vector3(),camRight=new THREE.Vector3(),moveVec=new THREE.Vector3();
function getMove(){const x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);const z=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);if(x===0&&z===0){moveVec.set(0,0,0);return moveVec}camera.getWorldDirection(camForward);camForward.y=0;camForward.normalize();camRight.crossVectors(camForward,new THREE.Vector3(0,1,0)).normalize();moveVec.copy(camForward).multiplyScalar(z).addScaledVector(camRight,x);moveVec.normalize();return moveVec}
function updateCamera(dt){const target=new THREE.Vector3(player.position.x,player.position.y+1.65,player.position.z);const cp=Math.cos(pitch),sp=Math.sin(pitch);const desired=target.clone().add(new THREE.Vector3(Math.sin(yaw)*cp*distance,sp*distance,Math.cos(yaw)*cp*distance));camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target)}

const mapCanvas=document.getElementById('mapCanvas'),mapCtx=mapCanvas.getContext('2d');
const mapPts=[['Fed',0,-33],['FSS',0,-16],['StP',-21,-4],['Eur',42,-47],['Arts',22,-70],['NGV',-12,-74]];
function drawMap(){mapCtx.clearRect(0,0,166,166);mapCtx.fillStyle='#2f4645';mapCtx.fillRect(0,0,166,166);mapCtx.strokeStyle='#6f8d83';mapCtx.lineWidth=2;for(const x of majorX){const p=(x+110)/220*166;mapCtx.beginPath();mapCtx.moveTo(p,2);mapCtx.lineTo(p,164);mapCtx.stroke()}for(const z of majorZ){const p=(z+75)/150*166;mapCtx.beginPath();mapCtx.moveTo(2,p);mapCtx.lineTo(164,p);mapCtx.stroke()}mapCtx.fillStyle='#557e85';mapCtx.fillRect(0,( -100+75)/150*166,166,25/150*166);mapCtx.fillStyle='#d8c58a';for(const q of mapPts){mapCtx.fillRect((q[1]+110)/220*166-2,(q[2]+75)/150*166-2,4,4)}mapCtx.fillStyle='#f4ead5';mapCtx.beginPath();mapCtx.arc((player.position.x+110)/220*166,(player.position.z+75)/150*166,4.5,0,Math.PI*2);mapCtx.fill()}

let clock=new THREE.Clock(),lastCull=0;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);const m=getMove();const sprint=keys.has('ShiftLeft')||keys.has('ShiftRight');const speed=sprint?CFG.sprint:CFG.walk;const step=m.clone().multiplyScalar(speed*dt);const nx=player.position.x+step.x,nz=player.position.z+step.z;if(!blocked(nx,player.position.z))player.position.x=THREE.MathUtils.clamp(nx,-104,104);if(!blocked(player.position.x,nz))player.position.z=THREE.MathUtils.clamp(nz,-69,65);if(m.lengthSq()>0)player.rotation.y=Math.atan2(m.x,m.z);
 velocityY-=16*dt;player.position.y+=velocityY*dt;if(player.position.y<=.15){player.position.y=.15;velocityY=0;onGround=true}avatar.position.y=onGround?Math.sin(performance.now()*.014*speed)*.02:0;
 updateCamera(dt);if(performance.now()-lastCull>700){const px=player.position.x,pz=player.position.z;for(const d of bData)d.g.visible=Math.hypot(d.x-px,d.z-pz)<125;lastCull=performance.now()}
 mapPts;drawMap();document.getElementById('status').innerHTML=`CBD · ${player.position.x.toFixed(0)}, ${player.position.z.toFixed(0)}<br>FPS ${Math.round(1/Math.max(dt,.001))} · CALLS ${renderer.info.render.calls}<br>${m.lengthSq()?'MOVING':'WASD READY'}`;renderer.render(scene,camera)}
updateCamera(.016);drawMap();loop();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
