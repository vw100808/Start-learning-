<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melbourne Open City · Exploration v0.3</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ef;background:#c8dfe3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c8dfe3}canvas{display:block;width:100vw;height:100vh}.panel{position:fixed;z-index:20;user-select:none;background:rgba(25,35,38,.66);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(7px);border-radius:12px}.hud{left:14px;top:14px;max-width:440px;padding:12px 14px;font-size:12px;line-height:1.55}.hud b{font-size:14px}.status{right:14px;top:14px;padding:11px 13px;min-width:210px;font-size:11px;line-height:1.55;text-align:right}.quest{left:50%;top:15px;transform:translateX(-50%);padding:8px 13px;border-radius:999px;font-size:11px}.tip{left:50%;bottom:16px;transform:translateX(-50%);padding:7px 12px;font-size:11px}.dialogue{display:none;left:50%;bottom:7%;transform:translateX(-50%);width:min(720px,calc(100vw - 36px));padding:15px 18px;background:rgba(24,31,33,.92);font-size:14px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.24)}.dialogue strong{display:block;margin-bottom:4px}.map{right:14px;bottom:14px;width:190px;height:190px;padding:4px;overflow:hidden}.map canvas{width:100%;height:100%}.bar{left:50%;bottom:48px;transform:translateX(-50%);width:min(300px,48vw);height:6px;overflow:hidden}.fill{height:100%;width:100%;background:#d8c58a}.fade{opacity:.75}@media(max-width:700px){.hud{max-width:300px}.map{width:150px;height:150px}.status{min-width:165px}.tip{font-size:10px}}</style></head><body><div class="panel hud"><b>Melbourne Open City · v0.3</b><br>WASD 移动 · Shift 冲刺 · Space 跳跃/互动 · 鼠标拖拽转向 · 滚轮缩放<br><span class="fade">当前重点：CBD 城市街区、建筑层次、Yarra 岸线、Tram 与地标骨架。</span></div><div class="panel status" id="status">DISTRICT: CBD<br>TIME: 09:30<br>SPEED: WALK<br>FPS: --</div><div class="panel quest" id="quest">Objective · 前往 Federation Square</div><div class="panel dialogue" id="dialogue"><strong id="dialogueTitle">City notice</strong><span id="dialogueText"></span></div><div class="panel map"><canvas id="mapCanvas" width="182" height="182"></canvas></div><div class="panel bar"><div class="fill" id="staminaFill"></div></div><div class="panel tip">探索提示：靠近地标后按 Space 互动</div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const WORLD=360,HALF=WORLD/2,WALK=4.4,SPRINT=7.6,JUMP=6.25,GRAVITY=16,clock=new THREE.Clock();
const scene=new THREE.Scene();scene.background=new THREE.Color('#c8dfe3');scene.fog=new THREE.Fog('#c8dfe3',110,330);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,700);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.NoToneMapping;document.body.appendChild(renderer.domElement);
const RAMPS=[{bp:.34,s:'#2d4a3e',l:'#7fa250'},{bp:.41,s:'#62707d',l:'#eee9d8'},{bp:.37,s:'#4d2d2a',l:'#ad5f45'},{bp:.35,s:'#352b25',l:'#7e6045'},{bp:.31,s:'#34444e',l:'#a2b8bb'},{bp:.42,s:'#31453a',l:'#d8c58a'},{bp:.39,s:'#243b46',l:'#557f88'}];
function rampTex(){const c=document.createElement('canvas'),w=256,h=RAMPS.length;c.width=w;c.height=h;const x=c.getContext('2d');RAMPS.forEach((r,i)=>{const cut=Math.round(r.bp*w);x.fillStyle=r.s;x.fillRect(0,i,cut,1);x.fillStyle=r.l;x.fillRect(cut,i,w-cut,1)});const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.flipY=false;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t}const ramp=rampTex();
const sunDir=new THREE.Vector3(-.52,.78,.42).normalize();
function mat(i,opts={}){const m=new THREE.MeshPhongMaterial({color:0xffffff,shininess:0,flatShading:true,side:opts.side??THREE.FrontSide,transparent:opts.transparent??false,opacity:opts.opacity??1,depthWrite:opts.depthWrite??true});m.onBeforeCompile=s=>{s.uniforms.uRampMap={value:ramp};s.uniforms.uRows={value:RAMPS.length};s.uniforms.uIndex={value:i};s.uniforms.uSun={value:sunDir};s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWN;').replace('#include <defaultnormal_vertex>','#include <defaultnormal_vertex>\nvWN=normalize(mat3(modelMatrix)*objectNormal);');s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D uRampMap;uniform float uRows;uniform float uIndex;uniform vec3 uSun;varying vec3 vWN;').replace('#include <output_fragment>',`float d=dot(normalize(vWN),normalize(uSun))*.5+.5;float sh=getShadowMask();sh=max(sh,.27);float u=clamp(d*sh,0.,1.);float v=(uIndex+.5)/uRows;outgoingLight=texture2D(uRampMap,vec2(u,v)).rgb;#include <output_fragment>`)};m.customProgramCacheKey=()=>`mel-${i}`;return m}
const M={grass:mat(0),wall:mat(1),roof:mat(2),wood:mat(3),stone:mat(4),accent:mat(5),glass:mat(6,{transparent:true,opacity:.82,depthWrite:false,side:THREE.DoubleSide})};
function rnd(a,b){const q=Math.sin(a*127.1+b*311.7)*43758.5453;return q-Math.floor(q)}
function jitter(g,a=.012){const p=g.attributes.position;for(let i=0;i<p.count;i++){const r=rnd(i+1,p.count+7);p.setX(i,p.getX(i)+(r-.5)*a);p.setZ(i,p.getZ(i)+(.5-r)*a)}p.needsUpdate=true;g.computeVertexNormals();return g}
function box(parent,s,p,ma,o={}){const g=jitter(new THREE.BoxGeometry(...s),o.j??.012),m=new THREE.Mesh(g,ma);m.position.set(...p);m.rotation.y=o.ry??0;m.castShadow=o.cast??true;m.receiveShadow=o.receive??true;parent.add(m);return m}
function cyl(parent,r,h,p,ma,o={}){const g=jitter(new THREE.CylinderGeometry(r,r*1.02,h,o.seg??8),o.j??.01),m=new THREE.Mesh(g,ma);m.position.set(...p);m.rotation.z=THREE.MathUtils.degToRad(o.tilt??0);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function plane(parent,w,d,p,ma){const g=new THREE.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);const m=new THREE.Mesh(g,ma);m.position.set(...p);m.receiveShadow=true;parent.add(m);return m}
const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(-75,105,65);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-145,right:145,top:145,bottom:-145,near:1,far:340});scene.add(sun);scene.add(new THREE.HemisphereLight(0xe5f1ee,0x38504b,.32));
const world=new THREE.Group();scene.add(world);plane(world,WORLD,WORLD,[0,0,0],M.grass);
// river + banks
const river= new THREE.Group();world.add(river);plane(river,290,34,[0,.02,55],M.stone);for(let i=-6;i<=6;i++){box(river,[22+(i%3)*2,.07,1.2],[i*22,.07,37+Math.sin(i*1.7)*1.4],M.accent,{j:.002,cast:false});box(river,[22+(i%4)*2,.07,1.2],[i*22,.07,73+Math.cos(i*1.4)*1.2],M.wood,{j:.002,cast:false})}
// road grid
const roads=new THREE.Group();world.add(roads);for(let x=-140;x<=140;x+=28)box(roads,[7,.05,295],[x,.035,0],M.stone,{j:.002,cast:false});for(let z=-112;z<=112;z+=28)box(roads,[295,.05,7],[0,.035,z],M.stone,{j:.002,cast:false});
// tram rails
const tram=new THREE.Group();world.add(tram);for(const z of [-14,14,70]){box(tram,[275,.035,.11],[0,.095,z],M.accent,{j:.001,cast:false});box(tram,[275,.035,.11],[0,.095,z+.82],M.accent,{j:.001,cast:false})}
// buildings, varied silhouettes
const buildings=new THREE.Group();world.add(buildings);const anchors=[];function building(x,z,w,d,h,roof=M.roof){const g=new THREE.Group();g.position.set(x,0,z);const bh=Math.max(3,h-.8);box(g,[w,bh,d],[0,bh/2,0],M.wall,{j:.018});const aw=w*(.35+.18*rnd(x,z)),ad=d*(.3+.13*rnd(z,x));box(g,[aw,bh*(.52+.13*rnd(z+2,x+4)),ad],[w*.24,bh*.29,d*.24],M.stone,{j:.015,ry:(rnd(x,z)>.5?.04:-.04)});box(g,[w+.2,.24,d+.2],[0,bh+.12,0],roof,{j:.01,ry:(rnd(z,x)-.5)*.08});if(h>12)box(g,[w*.16,h*.16,d*.75],[w*.25,bh*.57,d*.51],M.glass,{j:.01,cast:false,receive:true});for(let i=-1;i<=1;i++)box(g,[.09,bh*.7,.08],[i*w*.27,bh*.43,d*.51+.04],M.wood,{j:.003,cast:false});buildings.add(g);anchors.push({x,z,w,d,h})}
for(let x=-126;x<=126;x+=28)for(let z=-98;z<=126;z+=28){if((x===-14&&z===-14)||(Math.abs(z-55)<20&&Math.abs(x)<120))continue;const dist=Math.hypot(x,z);const h=7+Math.max(0,22-dist*.075)+rnd(x,z)*24;building(x,z,12+rnd(z,x)*6,12+rnd(x,z)*6,h,(rnd(x+8,z)>.68?M.roof:M.stone))}
// landmarks
const landmarks=new THREE.Group();world.add(landmarks);const landmarkData=[];function landmark(name,x,z,w,h,ma=M.wall){const g=new THREE.Group();g.position.set(x,0,z);box(g,[w,h,w*.72],[0,h/2,0],ma,{j:.012});box(g,[w*.75,.5,w*.55],[0,h+.25,0],M.accent,{j:.008});box(g,[w*.48,h*.25,.12],[0,h*.54,w*.37],M.glass,{j:.004,cast:false});landmarks.add(g);landmarkData.push({name,x,z,group:g})}
landmark('Federation Square',-18,-18,12,12,M.stone);landmark('Flinders Street Station',20,-18,24,10,M.roof);landmark('Arts Centre',55,-48,14,30,M.wall);landmark('Eureka',70,-18,12,42,M.glass);landmark('Queen Victoria Market',-70,-70,26,8,M.roof);landmark('Docklands',105,75,22,16,M.wall);
// street trees + lamp posts
const decor=new THREE.Group();world.add(decor);for(let x=-132;x<=132;x+=14){for(const z of [-10,10,38,82]){cyl(decor,.14,1.8,[x,.9,z],M.wood,{seg:7,tilt:x%28===0?3:-3});const crown=jitter(new THREE.IcosahedronGeometry(.82,1),.02),cm=new THREE.Mesh(crown,M.grass);cm.position.set(x,2.1,z);cm.castShadow=true;cm.receiveShadow=true;decor.add(cm)}for(const z of [-112,-56,0,56,112]){cyl(decor,.055,3,[x,.1+1.5,z],M.wood,{seg:6,tilt:5});cyl(decor,.18,.09,[x-.1,3.02,z],M.accent,{seg:6,tilt:0})}}
// parks / square accents
const parks=new THREE.Group();world.add(parks);plane(parks,70,55,[-100,.03,35],M.grass);plane(parks,58,40,[92,.03,-82],M.grass);for(let i=0;i<18;i++){const x=-125+rnd(i,8)*45,z=10+rnd(8,i)*45;cyl(parks,.12,1.7,[x,.85,z],M.wood,{seg:7,tilt:(rnd(z,x)-.5)*10});const crown=jitter(new THREE.IcosahedronGeometry(.75,1),.02),m=new THREE.Mesh(crown,M.grass);m.position.set(x,2,z);m.castShadow=true;parks.add(m)}
// player
const player=new THREE.Group();player.position.set(-112,0,-130);world.add(player);cyl(player,.34,1.45,[0,.72,0],M.accent,{seg:8,j:.006});cyl(player,.26,.52,[0,1.7,0],M.wall,{seg:8,j:.006});
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')interactOrJump()});addEventListener('keyup',e=>keys[e.code]=false);let yaw=.55,pitch=.31,drag=false,lastX=0,lastY=0,zoom=13;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch-dy*.004,.12,.58)});renderer.domElement.addEventListener('wheel',e=>{zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.015,8,18)});
const vel=new THREE.Vector3(),forward=new THREE.Vector3(),right=new THREE.Vector3(),wish=new THREE.Vector3();let grounded=true,stamina=1;const dialogue=document.getElementById('dialogue'),title=document.getElementById('dialogueTitle'),text=document.getElementById('dialogueText');function show(t,s){title.textContent=t;text.textContent=s;dialogue.style.display='block';clearTimeout(show.to);show.to=setTimeout(()=>dialogue.style.display='none',3200)}function nearest(){let best=null,bd=12;for(const p of landmarkData){const d=Math.hypot(player.position.x-p.x,player.position.z-p.z);if(d<bd){bd=d;best=p}}return best}function interactOrJump(){const n=nearest();if(n){show(n.name,'这里是当前版本的可探索地标节点。后续将加入可进入建筑、NPC、任务与环境事件。');return}if(grounded){vel.y=JUMP;grounded=false}}
const status=document.getElementById('status'),fill=document.getElementById('staminaFill'),map=document.getElementById('mapCanvas'),ctx=map.getContext('2d');function drawMap(){const s=182,k=s/WORLD;ctx.clearRect(0,0,s,s);ctx.fillStyle='rgba(24,36,39,.86)';ctx.fillRect(0,0,s,s);ctx.fillStyle='#597b82';ctx.fillRect(0,(55+HALF)*k,s,34*k);ctx.strokeStyle='rgba(216,197,138,.7)';ctx.lineWidth=1;for(let x=-140;x<=140;x+=28){ctx.beginPath();ctx.moveTo((x+HALF)*k,0);ctx.lineTo((x+HALF)*k,s);ctx.stroke()}for(let z=-112;z<=112;z+=28){ctx.beginPath();ctx.moveTo(0,(z+HALF)*k);ctx.lineTo(s,(z+HALF)*k);ctx.stroke()}ctx.fillStyle='#d8c58a';for(const p of landmarkData){ctx.fillRect((p.x+HALF)*k-2,(p.z+HALF)*k-2,4,4)}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((player.position.x+HALF)*k,(player.position.z+HALF)*k,3,0,Math.PI*2);ctx.fill()}
let t=0,frames=0,fps=0;function loop(){const dt=Math.min(clock.getDelta(),.05);t+=dt;frames++;if(t>1){fps=frames;frames=0;t=0}const moving=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD;const sprint=(keys.ShiftLeft||keys.ShiftRight)&&moving&&stamina>.02;const speed=sprint?SPRINT:WALK;if(sprint)stamina=Math.max(0,stamina-dt*.38);else stamina=Math.min(1,stamina+dt*.22);forward.set(Math.sin(yaw),0,Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));wish.set(0,0,0);if(keys.KeyW)wish.add(forward);if(keys.KeyS)wish.sub(forward);if(keys.KeyD)wish.add(right);if(keys.KeyA)wish.sub(right);if(wish.lengthSq()>0)wish.normalize();vel.x=wish.x*speed;vel.z=wish.z*speed;vel.y-=GRAVITY*dt;player.position.x=THREE.MathUtils.clamp(player.position.x+vel.x*dt,-HALF+2,HALF-2);player.position.z=THREE.MathUtils.clamp(player.position.z+vel.z*dt,-HALF+2,HALF-2);player.position.y+=vel.y*dt;if(player.position.y<=0){player.position.y=0;vel.y=0;grounded=true}const target=new THREE.Vector3(player.position.x,1.65+player.position.y,player.position.z);camera.position.copy(target).add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(zoom));camera.lookAt(target);const n=nearest();status.innerHTML=`DISTRICT: ${Math.abs(player.position.z)<28?'CBD':player.position.z>65?'Docklands':'Urban fringe'}<br>TIME: ${(9.5+(performance.now()/1000/60)%8).toFixed(2)}<br>SPEED: ${sprint?'SPRINT':'WALK'}<br>FPS: ${fps}`;fill.style.width=`${stamina*100}%`;drawMap();renderer.render(scene,camera);requestAnimationFrame(loop)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
