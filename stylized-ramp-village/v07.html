;font-size:10px}.hud b{font-size:12px}.status{top:65px;right:8px;min-width:160px;padding:8px 9px;font-size:9px}.quest{top:8px;max-width:56vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}.map{width:140px;height:140px;right:8px;bottom:86px}.bar{bottom:82px;width:150px}.tip{display:none}}

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const CFG={world:320,half:160,walk:4.8,sprint:8.2,jump:6.4,gravity:17,shadowMin:.27};
const scene=new THREE.Scene();scene.background=new THREE.Color('#b9d6da');scene.fog=new THREE.Fog('#b9d6da',90,315);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,650);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.NoToneMapping;document.body.appendChild(renderer.domElement);
const RAMPS=[['#365146','#91ae69'],['#66727a','#eee8da'],['#51302f','#b96e55'],['#3a3029','#86684d'],['#35464f','#afc2c2'],['#31453b','#dacb9a'],['#29454f','#719da5'],['#34423d','#879386'],['#303940','#7f8891'],['#273237','#5e6c73'],['#6b4639','#d59b7e']];
const lutData=new Uint8Array(256*RAMPS.length*3);function rgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}for(let y=0;y<RAMPS.length;y++){const a=rgb(RAMPS[y][0]),b=rgb(RAMPS[y][1]);for(let x=0;x<256;x++){const t=x/255,cut=y===1?.40:.36,p=t<cut?0:1;const c=p?b:a;const i=(y*256+x)*3;lutData[i]=c[0];lutData[i+1]=c[1];lutData[i+2]=c[2]}}const lut=new THREE.DataTexture(lutData,256,RAMPS.length,THREE.RGBFormat,THREE.UnsignedByteType);lut.magFilter=lut.minFilter=THREE.NearestFilter;lut.generateMipmaps=false;lut.flipY=false;lut.colorSpace=THREE.SRGBColorSpace;lut.needsUpdate=true;
const SUN=new THREE.Vector3(-.58,.76,.30).normalize();
function mat(row,opts={}){const m=new THREE.MeshPhongMaterial({color:0xffffff,flatShading:true,shininess:0,side:opts.side||THREE.FrontSide,transparent:opts.transparent||false,opacity:opts.opacity??1,depthWrite:opts.depthWrite??true});m.onBeforeCompile=s=>{s.uniforms.uL={value:lut};s.uniforms.uRows={value:RAMPS.length};s.uniforms.uRow={value:row};s.uniforms.uSun={value:SUN};s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWN;').replace('#include <defaultnormal_vertex>','#include <defaultnormal_vertex>\nvWN=normalize(mat3(modelMatrix)*objectNormal);');s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D uL;uniform float uRows,uRow;uniform vec3 uSun;varying vec3 vWN;').replace('#include <output_fragment>',`float ld=dot(normalize(vWN),normalize(uSun))*.5+.5;float sh=max(getShadowMask(),${CFG.shadowMin});float u=clamp(ld*sh,0.,1.);outgoingLight=texture2D(uL,vec2(u,(uRow+.5)/uRows)).rgb;#include <output_fragment>`)};m.customProgramCacheKey=()=>`v07-${row}`;return m}
const M={grass:mat(0),wall:mat(1),roof:mat(2),wood:mat(3),stone:mat(4),accent:mat(5),glass:mat(6,{transparent:true,opacity:.78,depthWrite:false,side:THREE.DoubleSide}),fabric:mat(7),pants:mat(8),hair:mat(9),skin:mat(10)};
const sun=new THREE.DirectionalLight(0xffffff,1.55);sun.position.copy(SUN).multiplyScalar(-120);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);sun.shadow.bias=-.0007;Object.assign(sun.shadow.camera,{left:-145,right:145,top:145,bottom:-145,near:1,far:340});scene.add(sun);scene.add(new THREE.HemisphereLight(0xe6f0ed,0x334a45,.42));
function hash(a,b){const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)}function box(p,s,pos,m,j=.01,cast=true){const g=new THREE.BoxGeometry(...s);const q=g.attributes.position;for(let i=0;i<q.count;i++){const r=hash(i+1,q.count+17);q.setX(i,q.getX(i)+(r-.5)*j);q.setZ(i,q.getZ(i)+(.5-r)*j)}q.needsUpdate=true;g.computeVertexNormals();const x=new THREE.Mesh(g,m);x.position.set(...pos);x.castShadow=cast;x.receiveShadow=true;p.add(x);return x}function cyl(p,r,h,pos,m,tilt=0){const x=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.02,h,8),m);x.position.set(...pos);x.rotation.z=THREE.MathUtils.degToRad(tilt);x.castShadow=true;x.receiveShadow=true;p.add(x);return x}function flat(p,w,d,pos,m){const g=new THREE.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);const x=new THREE.Mesh(g,m);x.position.set(...pos);x.receiveShadow=true;p.add(x);return x}
const world=new THREE.Group();scene.add(world);flat(world,CFG.world,CFG.world,[0,0,0],M.grass);const streets=new THREE.Group();world.add(streets);
for(let x=-140;x<=140;x+=28){box(streets,[7.3,.08,300],[x,.05,0],M.stone,.002,false);for(let z=-132;z<=132;z+=10)box(streets,[.10,.015,5],[x,.11,z],M.accent,.001,false)}for(let z=-112;z<=112;z+=28){box(streets,[300,.08,7.3],[0,.05,z],M.stone,.002,false);for(let x=-132;x<=132;x+=10)box(streets,[5,.015,.10],[x,.11,z],M.accent,.001,false)}
const river=new THREE.Group();world.add(river);flat(river,290,32,[0,-.02,58],M.glass);river.children[0].material.opacity=.70;for(let x=-138;x<=138;x+=18)box(river,[15,.05,.55],[x,.04,42+Math.sin(x)*1.2],M.accent,.001,false);
const buildings=new THREE.Group(),colliders=[];world.add(buildings);
function facade(g,w,d,h,seed){for(let y=2;y<h-.8;y+=2.9){for(let side of [-1,1])for(let k=-1;k<=1;k++){if(hash(seed+side,k+y)>.28)box(g,[.85,.72,.10],[k*w*.27,y,side*(d*.5+.05)],M.glass,.002,false)}}}
function building(x,z,w,d,h,style){const g=new THREE.Group();g.position.set(x,0,z);const bh=h-.8;box(g,[w,bh,d],[0,bh/2,0],M.wall,.018);box(g,[w*.42,bh*.55,d*.42],[-w*.20,bh*.31,d*.20],M.stone,.014);if(style===1)box(g,[w*.55,bh*.72,d*.50],[w*.18,bh*.52,-d*.10],M.wall,.014);facade(g,w,d,bh,Math.round(x+z));box(g,[w+.24,.23,d+.24],[0,bh+.13,0],M.roof,.01);if(style===0)cyl(g,.14,1.5,[w*.2,bh+1,-d*.15],M.wood,9);buildings.add(g);colliders.push({minX:x-w*.5-.45,maxX:x+w*.5+.45,minZ:z-d*.5-.45,maxZ:z+d*.5+.45})}
for(let x=-140;x<=140;x+=28)for(let z=-112;z<=140;z+=28){if(Math.abs(z-58)<22&&Math.abs(x)<120)continue;if(Math.hypot(x+20,z+18)<30)continue;const r=hash(x,z);building(x,z,14+r*7,14+(1-r)*7,8+r*34+Math.max(0,22-Math.hypot(x,z)*.06),Math.floor(r*2))}
const landmarks=[];function landmark(name,x,z,w,d,h,m,desc){const g=new THREE.Group();g.position.set(x,0,z);box(g,[w,h,d],[0,h/2,0],m,.015);box(g,[w*.7,h*.42,d*.65],[w*.12,h*.36,-d*.10],M.wall,.012);facade(g,w,d,h,Math.round(x*2+z));box(g,[w+.28,.26,d+.28],[0,h+.14,0],M.roof,.01);buildings.add(g);landmarks.push({name,x,z,desc})}
landmark('Federation Square',-20,-18,28,20,11,M.stone,'城市中心步行节点：广场、Yarra 与 Flinders Street 在这里形成核心环线。');landmark('Flinders Street Station',20,-18,40,22,12,M.roof,'主要方向锚点：通往 CBD 核心。');landmark('Arts Centre',54,-48,20,16,31,M.wall,'剧院区高耸地标。');landmark('Eureka Skydeck',72,-18,16,16,50,M.glass,'Southbank 垂直地标。');landmark('Queen Victoria Market',-72,-70,34,20,9,M.roof,'北侧生活节点。');
const props=new THREE.Group();world.add(props);for(let x=-126;x<=126;x+=14)for(const z of [-8,8,36,92]){cyl(props,.13,1.7,[x,.84,z],M.wood,x%28?4:-4);const c=new THREE.Mesh(new THREE.IcosahedronGeometry(.86,1),M.grass);c.position.set(x,2.05,z);c.castShadow=true;props.add(c)}for(let x=-140;x<=140;x+=28){for(const z of [-14,14,42,98]){cyl(props,.055,2.7,[x,.0,z],M.wood,x%56?5:-5);box(props,[.06,.06,.72],[x+.25,2.23,z],M.wood,.001,false);cyl(props,.12,.18,[x+.58,2.18,z],M.accent,0)}}
const traffic=new THREE.Group();world.add(traffic);const cars=[];for(let i=0;i<8;i++){const g=new THREE.Group();box(g,[3.6,.7,1.65],[0,.62,0],i%2?M.accent:M.roof,.008);box(g,[1.7,.42,1.2],[0,1.02,0],M.glass,.004,false);g.position.set(-155+(i%4)*28,.02,-112+Math.floor(i/4)*56);traffic.add(g);cars.push({g,dir:i%2?1:-1,z:g.position.z,x:g.position.x,speed:5+i%3})}
const player=new THREE.Group();player.position.set(-62,.05,-46);world.add(player);
function makePlayer(){const g=new THREE.Group();box(g,[.44,1.55,.48],[-.3,.82,0],M.pants,.01);box(g,[.44,1.55,.48],[.3,.82,0],M.pants,.01);box(g,[.58,.22,.95],[-.3,.12,.12],M.hair,.004);box(g,[.58,.22,.95],[.3,.12,.12],M.hair,.004);box(g,[1.35,1.35,.70],[0,1.95,0],M.fabric,.012);box(g,[.62,.95,.74],[0,2.1,.38],M.wall,.008);box(g,[.18,1.1,.12],[-.52,2.0,.42],M.accent,.004);box(g,[.18,1.1,.12],[.52,2.0,.42],M.accent,.004);box(g,[.20,.84,.10],[.68,2.1,.44],M.wood,.003);cyl(g,.16,.24,[0,2.72,0],M.skin);const h=new THREE.Mesh(new THREE.IcosahedronGeometry(.46,1),M.skin);h.position.y=3.13;h.castShadow=true;g.add(h);const hair=new THREE.Mesh(new THREE.IcosahedronGeometry(.37,1),M.hair);hair.scale.y=.62;hair.position.set(0,3.39,-.02);hair.castShadow=true;g.add(hair);box(g,[.26,.44,.40],[1.0,1.53,.06],M.wall,.004);box(g,[.26,.44,.40],[-1.0,1.53,.06],M.wall,.004);box(g,[.55,.18,.20],[.60,1.72,.20],M.wood,.004);return g}const avatar=makePlayer();player.add(avatar);
const keys=new Set();let yaw=.72,pitch=.31,distance=12.4,vy=0,ground=true,stamina=1,lastMap=0,lastNpc=0;const wish=new THREE.Vector3();addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'&&ground){vy=CFG.jump;ground=false}if(e.code==='KeyQ'||e.code==='KeyE')player.position.addScaledVector(wish,1.8);if(e.code==='KeyF')interact()});addEventListener('keyup',e=>keys.delete(e.code));let drag=false;addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')drag=true});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw-=e.movementX*.0055;pitch=THREE.MathUtils.clamp(pitch+e.movementY*.0035,.12,.62)}});addEventListener('wheel',e=>distance=THREE.MathUtils.clamp(distance+e.deltaY*.016,8,17),{passive:true});
function getWish(){let x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);let z=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0);const l=Math.hypot(x,z)||1;x/=l;z/=l;const c=Math.cos(yaw),s=Math.sin(yaw);wish.set(x*c-z*s,0,x*s+z*c);return wish}
function blocked(x,z){const r=.5;return colliders.some(c=>x>c.minX-r&&x<c.maxX+r&&z>c.minZ-r&&z<c.maxZ+r)}function interact(){let n=null,b=8;for(const l of landmarks){const d=Math.hypot(player.position.x-l.x,player.position.z-l.z);if(d<b){b=d;n=l}}if(!n)return;document.querySelector('.dialog').style.display='block';document.getElementById('dt').textContent=n.name;document.getElementById('dx').textContent='  '+n.desc;setTimeout(()=>document.querySelector('.dialog').style.display='none',3800)}
function updateNPC(t,dt){if(t-lastNpc<.09)return;lastNpc=t;for(let i=0;i<10;i++){let n=npcGroup.children[i];const d=Math.hypot(n.position.x-player.position.x,n.position.z-player.position.z);if(d>150){n.visible=false;continue}n.visible=true;n.position.x+=Math.cos(t*.5+i)*dt*.55;n.position.z+=Math.sin(t*.43+i*.7)*dt*.55}}
const npcGroup=new THREE.Group();world.add(npcGroup);for(let i=0;i<10;i++){const n=new THREE.Group();box(n,[.66,1.2,.5],[0,1.3,0],i%2?M.fabric:M.roof,.01);box(n,[.22,.52,.22],[0,.54,0],M.pants,.004);const h=new THREE.Mesh(new THREE.IcosahedronGeometry(.27,1),M.skin);h.position.y=2.18;n.add(h);n.position.set(hash(i,2)*2*80-80,.05,hash(i,3)*2*80-80);npcGroup.add(n)}
function drawMap(){const c=document.getElementById('map'),x=c.getContext('2d');x.fillStyle='#223638';x.fillRect(0,0,168,168);x.strokeStyle='#718983';x.lineWidth=2;for(let k=-140;k<=140;k+=28){let p=(k+160)/320*168;x.beginPath();x.moveTo(p,3);x.lineTo(p,165);x.stroke()}for(let k=-112;k<=112;k+=28){let p=(k+160)/320*168;x.beginPath();x.moveTo(3,p);x.lineTo(165,p);x.stroke()}x.fillStyle='#5b8288';x.fillRect(0,(58+160)/320*168,168,32/320*168);x.fillStyle='#d8c58a';for(const l of landmarks)x.fillRect((l.x+160)/320*168-2,(l.z+160)/320*168-2,4,4);x.fillStyle='#f1ead7';x.beginPath();x.arc((player.position.x+160)/320*168,(player.position.z+160)/320*168,4.5,0,Math.PI*2);x.fill()}
function cameraFollow(dt){const target=new THREE.Vector3(player.position.x,player.position.y+1.62,player.position.z);const cp=Math.cos(pitch),sp=Math.sin(pitch);const pos=target.clone().add(new THREE.Vector3(Math.sin(yaw)*cp*distance,sp*distance,Math.cos(yaw)*cp*distance));camera.position.lerp(pos,1-Math.pow(.001,dt));camera.lookAt(target)}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033),t=clock.elapsedTime;getWish();const sprint=keys.has('ShiftLeft')||keys.has('ShiftRight'),moving=wish.lengthSq()>0,s=sprint&&stamina>.03?CFG.sprint:CFG.walk;if(sprint&&moving)stamina=Math.max(0,stamina-dt*.16);else stamina=Math.min(1,stamina+dt*.11);const step=wish.clone().multiplyScalar(s*dt),nx=player.position.x+step.x,nz=player.position.z+step.z;if(!blocked(nx,player.position.z))player.position.x=THREE.MathUtils.clamp(nx,-155,155);if(!blocked(player.position.x,nz))player.position.z=THREE.MathUtils.clamp(nz,-155,155);vy-=CFG.gravity*dt;player.position.y+=vy*dt;if(player.position.y<=.05){player.position.y=.05;vy=0;ground=true}if(moving)player.rotation.y=Math.atan2(wish.x,wish.z);avatar.position.y=ground?Math.sin(t*s*.8)*.015:0;for(const c of cars){c.g.position.x+=c.dir*c.speed*dt;if(c.g.position.x>160)c.g.position.x=-160;if(c.g.position.x<-160)c.g.position.x=160}updateNPC(t,dt);if(t-lastMap>.5){drawMap();lastMap=t}cameraFollow(dt);document.getElementById('bar').style.width=(stamina*100).toFixed(1)+'%';let near=landmarks[0],dist=999;for(const l of landmarks){const d=Math.hypot(player.position.x-l.x,player.position.z-l.z);if(d<dist){dist=d;near=l}}document.getElementById('quest').textContent=`Objective · ${near.name} · ${Math.round(dist)} m`;document.getElementById('status').innerHTML=`${near.name}<br>TIME 09:30 · ${sprint?'SPRINT':'WALK'}<br>FPS ${Math.round(1/Math.max(dt,.0001))} · DRAW ${renderer.info.render.calls} · NPC ${npcGroup.children.filter(n=>n.visible).length}`;renderer.render(scene,camera)}drawMap();loop();
