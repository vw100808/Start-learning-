<script>
(function(){'use strict';

function box(x,y,z,w,h,d,m){const X=w/2,Z=d/2;const A=[x-X,y,z-Z],B=[x+X,y,z-Z],C=[x+X,y+h,z-Z],D=[x-X,y+h,z-Z],E=[x-X,y,z+Z],F=[x+X,y,z+Z],G=[x+X,y+h,z+Z],H=[x-X,y+h,z+Z];face(A,B,C,D,[0,0,-1],m);face(F,E,H,G,[0,0,1],m);face(E,A,D,H,[-1,0,0],m);face(B,F,G,C,[1,0,0],m);face(D,C,G,H,[0,1,0],m);face(E,F,B,A,[0,-1,0],m);}

function federation(){for(let i=-2;i<=2;i++){const x=i*23,z=-126+Math.abs(i)*5;roof(x,0,z,34,17+Math.abs(i)*3,25,4);}}
function cathedral(){box(72,0,-134,32,18,44,2);for(const x of [61,83]){box(x,18,-134,9,39,13,2);roof(x,57,-134,10,13,13,3);}}
function ngv(){box(-104,0,-94,70,20,38,6);box(-104,20,-94,66,3,34,4);box(-104,0,-73,60,11,1,5);for(let x=-130;x<=-78;x+=8)box(x,0,-72,3,9,.4,5);}
function arts(){box(132,0,-106,42,21,28,2);roof(132,21,-106,32,5,23,4);box(132,26,-106,9,95,9,5);cyl(132,121,-106,2,16,4,8);}
function eureka(){tower(42,-210,48,238,5);box(42,202,-210,40,32,42,5);}
function bridge(){box(0,2,-38,170,2.6,12,3);for(let x=-72;x<=72;x+=24){box(x,-1,-38,3,3,12,2);cyl(x,4,-38,.16,2,9,7);}}
function street(){box(0,-1,-22,440,1,86,6);box(0,-.3,20,440,.5,3,3);box(0,-.3,-64,440,.5,3,3);for(let z=-70;z>=-250;z-=27)box(0,.02,z,440,.15,12,3);for(let x=-205;x<=205;x+=18)box(x,.05,-22,13,.12,70,5);}
function world(){street();
for(let z=-68;z>=-238;z-=28){heritage(-128,z,48,30+(Math.abs(z)%50),1);modern(-70,z,46,48+(Math.abs(z)%70));heritage(-8,z,48,36+(Math.abs(z)%60),2);modern(54,z,48,60+(Math.abs(z)%80));heritage(116,z,48,42+(Math.abs(z)%45),1);tower(166,z,34,72+(Math.abs(z)%80),4);}
for(let x=-190;x<=190;x+=24){tree(x,-7,1.15);lamp(x+8,-13);}bridge();station();federation();cathedral();ngv();arts();eureka();
for(let z=-70;z>=-230;z-=43){car(-8,z,7);car(18,z+14,8);tram(78,z+17);}
// Yarra foreground
box(0,-.4,30,440,.4,70,5);for(let x=-190;x<=190;x+=24)box(x,0,8,16,.12,2,6);
}
world();
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);const inter=new Float32Array(pos.length/3*9);for(let i=0,j=0;i<pos.length;i+=3,j+=9){inter[j]=pos[i];inter[j+1]=pos[i+1];inter[j+2]=pos[i+2];inter[j+3]=nor[i];inter[j+4]=nor[i+1];inter[j+5]=nor[i+2];inter[j+6]=col[i];inter[j+7]=col[i+1];inter[j+8]=col[i+2];}gl.bufferData(gl.ARRAY_BUFFER,inter,gl.STATIC_DRAW);gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,3,gl.FLOAT,false,36,0);gl.enableVertexAttribArray(aN);gl.vertexAttribPointer(aN,3,gl.FLOAT,false,36,12);gl.enableVertexAttribArray(aC);gl.vertexAttribPointer(aC,3,gl.FLOAT,false,36,24);
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]}
function look(eye,target){const f=norm(sub(target,eye)),s=norm(cross(f,[0,1,0])),u=cross(s,f);return new Float32Array([s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-dot(s,eye),-dot(u,eye),dot(f,eye),1]);}
function perspective(fov,aspect,near,far){const f=1/Math.tan(fov/2),nf=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[r+4]*b[c*4+1]+a[r+8]*b[c*4+2]+a[r+12]*b[c*4+3];return o;}
let yaw=0,pitch=.16,dist=22;let target=[0,7,-65];let moving=false,joyId=null,camId=null,jx=0,jy=0,lastX=0,lastY=0;const joy=document.getElementById('joy'),knob=document.getElementById('knob');
function resize(){const d=Math.min(window.devicePixelRatio||1,1.35),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}
function camera(){const cp=Math.cos(pitch),sp=Math.sin(pitch);const eye=[target[0]+Math.sin(yaw)*cp*dist,target[1]+sp*dist,target[2]+Math.cos(yaw)*cp*dist];return mul(perspective(1.02,canvas.width/canvas.height,.1,900),look(eye,target));}

function move(){const f=-jy,a=jx,sprint=document.getElementById('run').classList.contains('on')?1.9:1;target[0]+=(-Math.sin(yaw)*f+Math.cos(yaw)*a)*sprint;target[2]+=(-Math.cos(yaw)*f-Math.sin(yaw)*a)*sprint;}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);moving=true;joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;jx=jy=0;knob.style.transform='translate(0,0)'}});function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),mx=r.width*.34,len=Math.hypot(dx,dy)||1,k=Math.min(1,mx/len);jx=dx/mx*k;jy=dy/mx*k;knob.style.transform='translate('+dx*k+'px,'+dy*k+'px)';}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){camId=e.pointerId;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(camId)}else if(e.clientX>innerWidth*.42){camId=e.pointerId;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(camId)}});canvas.addEventListener('pointermove',e=>{if(e.pointerId!==camId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.006;pitch=Math.max(-.55,Math.min(.65,pitch-dy*.004));});canvas.addEventListener('pointerup',e=>{if(e.pointerId===camId)camId=null});
const run=document.getElementById('run');run.addEventListener('pointerdown',()=>run.classList.add('on'));run.addEventListener('pointerup',()=>run.classList.remove('on'));run.addEventListener('pointercancel',()=>run.classList.remove('on'));
