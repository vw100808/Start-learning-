const move=new THREE.Vector3(),target=new THREE.Vector3(),offset=new THREE.Vector3(),clockDir=new THREE.Vector3();let vy=0,grounded=true,stamina=1,worldTime=9.5;

function text(label){return {'Federation Square':'探索起点：Yarra、Flinders Street 与 Southbank 在这里形成第一条步行环线。','Flinders Street Station':'河岸东侧的城市地标，作为进入 CBD 核心的方向锚点。','Eureka Skydeck':'Southbank 的垂直地标；后续版本可加入电梯、室内与高处观景玩法。','Arts Centre Melbourne':'剧院区锚点；后续可以扩展步行空间、演出与室内区域。','Queen Victoria Market':'北部城市锚点；市场由多个程序化大厅构成。','Docklands':'西部滨水区；后续可以扩展码头、公寓与体育场周边。','Carlton Gardens':'北侧绿色地标；后续可以扩展公园、博物馆与隐藏探索点。'}[label]||'Melbourne Open City landmark.'}
